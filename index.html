<title>수딩로그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F1F3EF;
    --surface:#FFFFFF;
    --surface-2:#E8EBE4;
    --line:#D8DCD3;
    --text:#161A16;
    --text-muted:#5B6259;
    --text-faint:#8B9187;

    --accent:#E15B36;        /* ember: primary / personal workout */
    --accent-ink:#B23F20;
    --on-accent:#FFFFFF;     /* 주황 위에 올라가는 글자색 */
    --pt:#7C6FE0;            /* PT session */
    --diet:#CE9A2A;          /* meals */
    --water:#1F8A79;         /* water / recovery */
    --protein:#A8641E;       /* protein */
    --supp:#C1587A;          /* supplements */
    --inbody:#3B7DD8;        /* InBody */

    --p-chest:var(--accent);
    --p-back:var(--water);
    --p-shoulder:var(--pt);
    --p-arm:var(--diet);
    --p-leg:var(--inbody);
    --p-core:var(--supp);
    --p-cardio:var(--water);

    --font-display:'Black Han Sans','IBM Plex Sans KR',sans-serif;
    --font-body:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-1:0 1px 2px rgba(20,24,18,.06), 0 8px 24px -12px rgba(20,24,18,.18);
    --shadow-2:0 4px 10px rgba(20,24,18,.08), 0 24px 48px -20px rgba(20,24,18,.28);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14181A;
      --surface:#1C211F;
      --surface-2:#252B27;
      --line:#333B35;
      --text:#EDEFE9;
      --text-muted:#9BA39A;
      --text-faint:#6E766D;

      --accent:#FF7A52;
      --accent-ink:#FFA485;
      --on-accent:#2B1207;
      --pt:#9C8FFF;
      --diet:#F0BF4C;
      --water:#34C2A6;
      --protein:#E0A15C;
      --supp:#E28098;
      --inbody:#5B9EF2;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --shadow-2:0 4px 10px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A;
    --surface:#1C211F;
    --surface-2:#252B27;
    --line:#333B35;
    --text:#EDEFE9;
    --text-muted:#9BA39A;
    --text-faint:#6E766D;

    --accent:#FF7A52;
    --accent-ink:#FFA485;
    --on-accent:#2B1207;
    --pt:#9C8FFF;
    --diet:#F0BF4C;
    --water:#34C2A6;
    --protein:#E0A15C;
    --supp:#E28098;
    --inbody:#5B9EF2;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-2:0 4px 10px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  /* 어떤 이유로든 가로로 넘치더라도 화면이 옆으로 밀리지 않게 막는다 */
  html,body{max-width:100%;overflow-x:hidden;}
  .app{overflow-x:clip;}
  .tabs{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media (max-width:420px){
    .app{padding-left:14px;padding-right:14px;}
    .topbar h1,.cal-head h2{font-size:clamp(20px,7vw,30px);}
    .tab-btn{padding:9px 13px;font-size:13.5px;}
  }
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:#fff;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .app{max-width:980px;margin:0 auto;padding:0 20px 64px;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:22px 0 14px;}
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .mark{font-family:var(--font-display);font-size:28px;color:var(--accent);}
  .wordmark .sub{font-size:12px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.04em;}
  .week-strip{display:flex;gap:14px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);}
  .week-strip b{color:var(--text);font-weight:600;}
  .tabs{display:flex;gap:6px;margin-top:16px;background:var(--surface-2);padding:4px;border-radius:12px;width:fit-content;}
  .tab-btn{border:none;background:transparent;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;}
  .tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);}
  .tab-btn:hover:not(.active){color:var(--text);}

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px;}
  .cal-head h2{font-size:26px;margin:0;}
  .cal-nav{display:flex;gap:6px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .icon-btn:hover{background:var(--surface-2);}
  .today-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;}

  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow-row span{text-align:center;font-size:11px;color:var(--text-faint);font-weight:600;letter-spacing:.06em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  /* min-width:0 이 없으면 칸 안의 점·시간 글자가 칸을 밀어내서
     7칸 그리드가 화면 밖으로 넘어간다(달력이 잘려 보이던 원인). */
  .day-cell{position:relative;aspect-ratio:1/0.92;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .12s,transform .08s;min-width:0;overflow:hidden;}
  .day-cell:hover{border-color:var(--text-faint);}
  .day-cell:active{transform:scale(.97);}
  .day-cell.outside{opacity:.35;}
  .day-cell.today{border-color:var(--accent);border-width:2px;padding:7px;}
  .day-cell.selected{box-shadow:0 0 0 2px var(--accent) inset;}
  .day-num{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-muted);}
  .day-cell.today .day-num{color:var(--accent);}
  .day-dots{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;overflow:hidden;min-width:0;}
  .dot-more{font-family:var(--font-mono);font-size:9.5px;font-weight:600;color:var(--text-faint);
    line-height:1;white-space:nowrap;margin-left:1px;}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  /* 좁은 화면에서는 칸을 세로로 넉넉하게, 점과 글자는 작게 */
  @media (max-width:480px){
    .cal-grid{gap:4px;}
    .day-cell{aspect-ratio:auto;min-height:58px;padding:6px 5px;}
    .day-num{font-size:12px;}
    .day-cell .dot{width:5px;height:5px;}
    .day-dots{gap:2.5px;}
    .dot-more{font-size:9px;margin-left:0;}
    .day-mins{font-size:9px;}
    .legend{gap:10px;font-size:11.5px;}
  }
  .day-mins{font-size:10px;font-family:var(--font-mono);color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;font-size:12px;color:var(--text-muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:8px;height:8px;}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,18,15,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  @media (min-width:720px){.overlay{align-items:center;}}
  .sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;box-shadow:var(--shadow-2);display:flex;flex-direction:column;transform:translateY(24px);transition:transform .2s;overflow:hidden;}
  .overlay.open .sheet{transform:translateY(0);}
  @media (min-width:720px){.sheet{border-radius:20px;margin-bottom:0;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);flex:none;}
  .sheet-head h3{margin:0;font-size:20px;}
  .sheet-head .save-status{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}
  .sheet-body{padding:20px 22px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  /* 시트가 열려 있는 동안 뒤 화면은 스크롤되지 않게 고정한다.
     iOS 는 overflow:hidden 만으로는 안 막혀서 위치를 고정하고 스크롤값을 기억해 둔다. */
  body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden;}
  .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text);cursor:pointer;font-size:15px;flex:none;}

  .section{border-top:1px solid var(--line);padding:18px 0;}
  .section:first-child{border-top:none;padding-top:0;}
  .section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .section-head .dot{width:9px;height:9px;}
  .section-head h4{margin:0;font-size:14px;font-weight:700;letter-spacing:.01em;}
  .sec-edit{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--text-muted);
    border-radius:8px;padding:5px 11px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
  .sec-edit:hover{border-color:var(--accent);color:var(--accent);}

  /* 저장된 뒤 보이는 요약 */
  .sum-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .sum-kind{font-size:11.5px;font-weight:700;color:var(--on-accent);border-radius:999px;padding:3px 10px;}
  .sum-dur{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);}
  .sum-ex{margin-bottom:12px;}
  .sum-ex + .sum-ex{border-top:1px solid var(--line);padding-top:11px;}
  .sum-ex-name{font-size:14px;font-weight:700;margin-bottom:5px;}
  .sum-tag{font-size:10px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 6px;vertical-align:1px;}
  .sum-sets{display:flex;flex-direction:column;gap:2px;}
  .sum-set{display:flex;align-items:baseline;gap:9px;font-size:13px;}
  .sum-set .n{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:38px;flex:none;}
  .sum-set .v{font-family:var(--font-mono);}
  .sum-set.failed .v{color:var(--supp);text-decoration:line-through;}
  .sum-set .fx{font-size:11.5px;color:var(--supp);}
  .sum-note{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.6;}
  .sum-empty{font-size:13px;color:var(--text-faint);}
  .sum-meals{display:flex;flex-direction:column;gap:6px;}
  .sum-meal{display:flex;align-items:baseline;gap:10px;font-size:13.5px;}
  .sum-meal .lab{color:var(--text-muted);width:46px;flex:none;font-size:12.5px;}
  .sum-meal .tm{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);width:42px;flex:none;}
  .sum-meal .tx{flex:1;min-width:0;}

  .segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;}
  .segmented button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);}

  .field-row{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .field-row label{font-size:13px;color:var(--text-muted);flex:none;width:84px;}
  input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:44px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px 6px 12px;font-size:13px;cursor:pointer;user-select:none;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip .rm{opacity:.7;font-size:11px;}
  .add-chip{border:1px dashed var(--text-faint);background:transparent;color:var(--text-muted);}
  .pick-btn{border:1px dashed var(--line);background:transparent;color:var(--text-muted);border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;width:100%;text-align:left;}
  .pick-btn:hover{border-color:var(--accent);color:var(--text);}

  .meal-grid{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;align-items:center;}
  .meal-grid label{font-size:12.5px;color:var(--text-muted);}

  .water-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .water-btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .water-btn:hover{border-color:var(--water);color:var(--water);}
  .prot-row .water-btn:hover{border-color:var(--protein);color:var(--protein);}
  .water-total{font-family:var(--font-mono);font-size:20px;font-weight:600;margin-left:auto;}
  .water-bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
  .water-bar>i{display:block;height:100%;background:var(--water);border-radius:5px;transition:width .25s;}
  .water-goal{font-size:11px;color:var(--text-faint);margin-top:5px;font-family:var(--font-mono);}

  .inbody-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .inbody-toggle .arrow{transition:transform .15s;color:var(--text-faint);}
  .inbody-toggle.open .arrow{transform:rotate(90deg);}
  .inbody-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .inbody-grid .full{grid-column:1/-1;}
  .ib-field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-family:var(--font-mono);}

  /* ---------- exercise library ---------- */
  .lib-tools{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:180px;position:relative;}
  .search-box input{padding-left:34px;}
  .search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:14px;}
  .part-filters{display:flex;gap:6px;flex-wrap:wrap;}
  .part-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .part-chip.active{color:#fff;border-color:transparent;}

  .part-section{margin-top:26px;}
  .part-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px;}
  .part-title .dot{width:9px;height:9px;}
  .ex-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
  .ex-row{display:flex;align-items:center;gap:13px;padding:11px 14px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .12s;}
  .ex-row:first-child{border-top:none;}
  .ex-row:hover{background:var(--surface-2);}
  .ex-row-thumb{width:52px;height:52px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#161C18;}
  .ex-row-thumb svg{width:78px;height:78px;flex:none;}
  .ex-row-noicon{font-family:var(--font-display);font-size:18px;}
  .ex-row-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ex-row-name{font-size:14.5px;font-weight:600;}
  .ex-row-name small{font-weight:500;color:var(--text-faint);font-size:11px;}
  .ex-row-meta{font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-row-chevron{flex:none;color:var(--text-faint);font-size:18px;}
  .anim-badge{flex:none;font-size:10px;font-family:var(--font-mono);color:var(--text-faint);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .anim-badge .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite;}
  @media (max-width:560px){ .ex-row-meta{display:none;} .anim-badge{display:none;} }

  /* favourite star */
  .fav-btn{flex:none;width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--text-faint);font-size:17px;line-height:1;cursor:pointer;transition:background .12s,color .12s;font-family:inherit;}
  .fav-btn:hover{background:var(--surface-2);color:var(--accent);}
  .fav-btn.on{color:var(--accent);}
  .picker-row .fav-btn{width:26px;height:26px;font-size:14px;}
  .fav-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .fav-pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}

  /* external reference links */
  .ex-ref{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .ex-ref a{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:600;text-decoration:none;}
  .ex-ref a:hover{border-color:var(--accent);color:var(--accent);}
  .ex-ref-note{font-size:11.5px;color:var(--text-faint);margin-top:7px;line-height:1.5;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* ---------- exercise detail ---------- */
  .rig-stage{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .rig-stage svg{width:100%;max-width:280px;height:auto;}
  .rig-caption{font-size:11px;color:var(--text-faint);text-align:center;}
  .ex-detail-tags{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;}
  .tag-pill{font-size:11.5px;font-weight:600;border-radius:20px;padding:4px 11px;color:#fff;}
  .steps-list{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.65;}
  .steps-list li{margin-bottom:4px;}
  .angle-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .angle-list li{font-size:13.5px;background:var(--surface-2);border-radius:9px;padding:8px 11px;display:flex;gap:8px;align-items:flex-start;}
  .angle-list li::before{content:"∠";font-family:var(--font-mono);color:var(--accent);font-weight:600;}

  /* ---------- exercise picker modal ---------- */
  .picker-search{margin-bottom:12px;}
  .picker-list{display:flex;flex-direction:column;gap:4px;}
  .picker-part{font-size:11.5px;font-weight:700;color:var(--text-faint);margin:14px 0 6px;letter-spacing:.04em;}
  .picker-part:first-child{margin-top:0;}
  .picker-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;}
  .picker-row:hover{background:var(--surface-2);}
  .picker-row .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .picker-row.checked .box{background:var(--accent);border-color:var(--accent);}
  .picker-row .nm{font-size:14px;flex:1;}
  .picker-row .mu{font-size:11.5px;color:var(--text-faint);}
  .picker-done{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;margin:0 -22px -28px;}
  .primary-btn{width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .primary-btn:hover{background:var(--accent-ink);}

  .empty-note{font-size:13px;color:var(--text-faint);padding:14px 0;}

  /* ---------- rig joints ---------- */
  @keyframes rigSwing{0%,100%{transform:rotate(var(--a0,0deg));}50%{transform:rotate(var(--a1,0deg));}}
  @keyframes rigBob{0%,100%{transform:translateY(var(--b0,0px));}50%{transform:translateY(var(--b1,0px));}}
  @keyframes rigBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.018);}}
  @keyframes glowPulse{0%,100%{opacity:.18;}50%{opacity:.42;}}
  .jointRotate{animation:rigSwing var(--dur,2.6s) ease-in-out infinite;}
  .bobber{animation:rigBob var(--dur,2.6s) ease-in-out infinite;}
  .breather{animation:rigBreathe 3.2s ease-in-out infinite;}
  .glow{animation:glowPulse var(--dur,2.6s) ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){
    .jointRotate,.bobber,.breather,.glow{animation:none!important;}
  }

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    .inbody-grid{grid-template-columns:1fr 1fr;}
    .wordmark .mark{font-size:24px;}
  }

  /* ---------- inbody tab ---------- */
  .ib-tab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:22px 0 20px;flex-wrap:wrap;}
  .ib-tab-head h2{margin:0 0 4px;font-size:26px;}
  .ib-tab-sub{margin:0;font-size:13px;color:var(--text-faint);}
  .ib-tab-actions{display:flex;gap:8px;flex:none;}
  .ghost-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .ghost-btn:hover{border-color:var(--inbody);color:var(--inbody);}

  .ib-empty{border:1px dashed var(--line);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;color:var(--text-muted);}
  .ib-empty p{max-width:360px;margin:6px auto 18px;font-size:13.5px;}

  .ib-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:22px;}
  .ib-stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;}
  .ib-stat-tile .label{font-size:11.5px;color:var(--text-faint);}
  .ib-stat-tile .value{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:4px;}
  .ib-stat-tile .value small{font-size:12px;color:var(--text-faint);font-weight:500;}
  .ib-stat-tile .delta{font-size:11.5px;color:var(--text-muted);margin-top:3px;font-family:var(--font-mono);}

  .ib-chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;margin-bottom:26px;}
  .ib-chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 16px 8px;position:relative;}
  .ib-chart-card .ch-title{font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .ib-chart-card .ch-value{font-family:var(--font-mono);font-size:19px;font-weight:600;margin:2px 0 8px;}
  .ib-chart-card svg{width:100%;height:auto;overflow:visible;}
  .ib-chart-card .ch-empty{font-size:12px;color:var(--text-faint);padding:20px 0;text-align:center;}
  .ib-tooltip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:11px;font-family:var(--font-mono);padding:4px 8px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;}
  .ib-tooltip.show{opacity:1;}

  .ib-hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .ib-hist{overflow-x:auto;}
  .ib-hist-row{display:grid;grid-template-columns:76px repeat(var(--ib-cols,9),minmax(62px,1fr)) 28px;gap:6px;padding:11px 14px;font-size:12.5px;align-items:center;border-top:1px solid var(--line);cursor:pointer;min-width:max-content;}
  .ib-hist-row:first-child{border-top:none;}
  .ib-hist-row:hover{background:var(--surface-2);}
  .ib-hist-row.head{font-weight:700;color:var(--text-faint);font-size:11px;cursor:default;}
  .ib-hist-row.head:hover{background:transparent;}
  .ib-hist-row .num{font-family:var(--font-mono);}
  .ib-hist-row .del{color:var(--text-faint);text-align:center;}
  .ib-hist-row .del:hover{color:var(--supp);}
  @media (max-width:640px){
    .ib-hist-row{grid-template-columns:72px repeat(var(--ib-cols,9),68px) 24px;}
  }

  .ib-import-hint{font-size:13px;color:var(--text-muted);margin:0 0 12px;line-height:1.6;}
  #ibCsvFile{font-size:13px;}
  .ib-preview-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px;}
  .ib-preview-table th,.ib-preview-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  .ib-preview-table th{color:var(--text-faint);font-weight:600;}
  .ib-preview-wrap-scroll{overflow-x:auto;}
  .ib-preview-note{font-size:12px;color:var(--text-faint);margin-top:8px;}

  /* ---------- 운동 상세 탭 (기본 / 선생님) ---------- */
  .ex-tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:18px;}
  .ex-tab{flex:1;border:none;background:transparent;padding:9px 10px;border-radius:8px;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .ex-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);}
  .ex-tab .cnt{font-family:var(--font-mono);font-size:11px;background:var(--accent);color:var(--on-accent);
    border-radius:999px;padding:1px 6px;font-weight:700;}

  /* ---------- 선생님 운동법 ---------- */
  .pt-datebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .pt-datebar select{flex:1;min-width:150px;}
  .pt-empty{font-size:13px;color:var(--text-faint);line-height:1.7;padding:18px;background:var(--surface-2);border-radius:var(--radius-md);}
  .pt-plan{background:var(--surface-2);border-radius:var(--radius-md);padding:15px 16px;}
  .pt-plan h5{margin:0 0 9px;font-size:12px;font-family:var(--font-mono);color:var(--text-faint);letter-spacing:.04em;}
  .pt-setline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .pt-setline:first-of-type{border-top:none;}
  .pt-setline .n{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);width:34px;flex:none;}
  .pt-setline .v{font-family:var(--font-mono);font-weight:600;}
  .pt-method{font-size:13.5px;line-height:1.75;white-space:pre-wrap;margin-top:10px;color:var(--text);}
  .pt-parse-preview{font-size:12px;color:var(--text-muted);background:var(--surface-2);border-radius:10px;padding:11px 13px;margin-top:9px;line-height:1.7;}
  .pt-parse-preview b{font-family:var(--font-mono);}
  .pt-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .pt-actions button{flex:1;min-width:130px;}

  /* ---------- 선생님 루틴 ---------- */
  .rt-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;
    border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);
    cursor:pointer;font-family:inherit;color:var(--text);margin-bottom:9px;}
  .rt-card:hover{border-color:var(--accent);}
  .rt-card .mid{flex:1;min-width:0;}
  .rt-card .nm{display:block;font-size:14.5px;font-weight:700;}
  .rt-card .meta{display:block;font-size:12px;color:var(--text-faint);margin-top:3px;}
  .rt-card .chev{color:var(--text-faint);font-size:18px;flex:none;}
  .rt-item{border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:10px;background:var(--surface);}
  .rt-item .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .rt-item .nm{font-size:14.5px;font-weight:700;}
  .rt-item .sum{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
  .rt-item .steps{font-size:12.5px;color:var(--text-muted);line-height:1.7;margin-top:8px;white-space:pre-wrap;}
  .rt-item .warn{font-size:12px;color:var(--supp);margin-top:6px;}
  .rt-item select{margin-top:8px;}
  .rt-back{border:none;background:transparent;color:var(--text-muted);font-family:inherit;
    font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:10px;}

  /* 영양제 칩 끌어서 순서 바꾸기 */
  /* 영양제 칩은 탭으로만 켜고 끈다 (드래그는 스크롤과 충돌해서 뺐다) */
  #suppChipRow .chip{user-select:none;-webkit-user-select:none;}

  /* ---------- 하루 기록: 운동 방식 선택 · 세트 실패 · 메모 ---------- */
  .mode-seg{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;margin:10px 0 4px;}
  .mode-seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-family:inherit;
    font-size:12px;font-weight:700;color:var(--text-faint);cursor:pointer;}
  .mode-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);}
  .pt-hint{font-size:12px;color:var(--text-muted);background:var(--surface-2);border-radius:9px;
    padding:9px 11px;margin:8px 0;line-height:1.6;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  .pt-hint .apply{border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:8px;padding:5px 10px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .set-fail-btn{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--text-faint);font-size:12px;cursor:pointer;font-family:inherit;}
  .set-fail-btn.on{background:var(--supp);border-color:var(--supp);color:#fff;}
  .set-fail-reason{margin:2px 0 8px 38px;}
  .set-fail-reason input{font-size:12.5px;}
  .ex-note-row{margin-top:10px;}
  .ex-note-row label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-family:var(--font-mono);}
  .rec-badge{flex:none;font-size:10px;font-family:var(--font-mono);border-radius:999px;padding:2px 7px;white-space:nowrap;}
  .rec-badge.pt{background:var(--accent);color:var(--on-accent);}

  /* ---------- 식단: 시간 + 간식 여러 개 ---------- */
  .meal-row{display:grid;grid-template-columns:52px 96px 1fr;gap:8px;align-items:center;margin-bottom:8px;}
  .meal-row > label{font-size:12.5px;color:var(--text-muted);}
  .snack-row{display:grid;grid-template-columns:52px 96px 1fr 30px;gap:8px;align-items:center;margin-bottom:8px;}
  .snack-del{border:none;background:transparent;color:var(--text-faint);font-size:14px;cursor:pointer;font-family:inherit;}
  .snack-del:hover{color:var(--supp);}
  .add-line-btn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--text-muted);
    border-radius:10px;padding:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:2px;}
  .add-line-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* 하루 기록: 저장 버튼 · 미저장 안내 */
  .head-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .save-btn{padding:9px 18px;border-radius:10px;border:none;background:var(--surface-2);color:var(--text-faint);
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:not-allowed;transition:background .14s,color .14s;}
  .save-btn.dirty{background:var(--accent);color:var(--on-accent);cursor:pointer;}
  .dirty-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 20px;
    background:#FBEEE9;border-bottom:1px solid var(--line);font-size:12.5px;color:#8A3A22;}
  .dirty-bar button{padding:7px 13px;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent;}
  .dirty-bar .db-primary{background:var(--accent);color:var(--on-accent);}
  .dirty-bar .db-ghost{background:transparent;border-color:#D9B4A6;color:#8A3A22;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .dirty-bar{background:#2A1B14;color:#F0C4B2;} }
  :root[data-theme="dark"] .dirty-bar{background:#2A1B14;color:#F0C4B2;}

  /* inbody record detail */
  .ibd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .ibd-date{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);}
  .ibd-group{margin-top:20px;}
  .ibd-group h5{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-mono);}
  .ibd-rows{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
  .ibd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;}
  .ibd-row:first-child{border-top:none;}
  .ibd-row .k{color:var(--text-muted);}
  .ibd-row .v{font-family:var(--font-mono);font-weight:600;}
  .ibd-row .v small{font-weight:500;color:var(--text-faint);font-size:11px;}
  .ibd-row .dlt{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-left:8px;}
  .ibd-actions{display:flex;gap:8px;margin-top:22px;}
  .ibd-actions button{flex:1;}
  .ibd-memo{font-size:12.5px;color:var(--text-muted);line-height:1.7;background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px;word-break:break-all;}
  .ib-preview-note.warn{color:var(--supp);}
  .ib-link{color:var(--inbody);font-weight:600;cursor:pointer;text-decoration:underline;}

  /* ---------- exercise set cards (day sheet) ---------- */
  .ex-set-card{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 13px;margin-top:10px;background:var(--bg);}
  .ex-set-head{display:flex;align-items:center;gap:10px;}
  .ex-set-thumb{width:46px;height:46px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#161C18;}
  .ex-set-thumb svg{width:70px;height:70px;flex:none;}
  .ex-set-noicon{font-size:10px;font-weight:700;color:#cfd6ca;}
  .ex-set-titlewrap{flex:1;min-width:0;}
  .ex-set-name{display:block;font-size:14px;font-weight:600;cursor:pointer;}
  .ex-set-name:hover{color:var(--accent);}
  .ex-set-muscle{display:block;font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-set-remove{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-faint);cursor:pointer;font-size:11px;}
  .ex-set-remove:hover{color:var(--supp);}
  .set-group-label{font-size:10.5px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin:10px 0 5px;}
  .set-rows{display:flex;flex-direction:column;gap:6px;}
  .set-row{display:grid;grid-template-columns:46px 1fr auto 1fr auto;align-items:center;gap:6px;}
  .set-idx{font-size:12px;color:var(--text-faint);font-family:var(--font-mono);}
  .set-x{font-size:11px;color:var(--text-faint);text-align:center;}
  .set-reps,.set-kg{padding:7px 8px;font-size:13px;text-align:center;font-family:var(--font-mono);}
  .set-del{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:10px;}
  .set-del:hover{color:var(--supp);}
  .set-add-btn{border:1px dashed var(--line);background:transparent;color:var(--text-muted);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;margin-top:7px;width:100%;text-align:left;}
  .set-add-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- rig dark stage (both the card thumbnail and the full detail stage) ---------- */
  .rig-stage{background:#161C18;--rig-ink:#E9EDE4;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}

<body>

<div class="app">

      </div>
      <div id="libResults"></div>
    </section>

    <!-- 인바디 뷰 -->
    <section class="view" id="view-inbody">
      <div class="ib-tab-head">
        <div>
          <h2>인바디</h2>
          <p class="ib-tab-sub">체성분 측정 기록과 변화 추이</p>

        <div class="ib-tab-actions">
          <button class="ghost-btn" id="ibImportBtn">CSV 가져오기</button>
          <button class="primary-btn" id="ibAddBtn" style="width:auto;padding:11px 18px">+ 기록 추가</button>
        </div>
      </div>
      <div id="ibTabBody"></div>
    </section>
  </main>
</div>

<!-- 하루 기록 모달 -->

      </div>

</div>

<!-- 운동 선택 모달 -->

/* 선생님이 보내준 글을 그대로 붙여넣으면 무게·횟수·세트로 나눠 담는다.
   "인클라인 20kg 12회 4세트", "랫풀다운 25 x 10 x 3", "3세트 12회 20킬로" 같은 표현을 읽는다.
   숫자를 못 찾은 줄은 그대로 '방법' 설명으로 남긴다. */
function parsePtText(text){
  const sets = [], methodLines = [];
  String(text||'').split(/\r?\n/).forEach(line=>{
    const t = line.trim();
    if(!t){ return; }
    let weight = null, reps = null, count = 1, matched = false;

    const mW = t.match(/(\d+(?:\.\d+)?)\s*(?:kg|KG|Kg|킬로|㎏)/);
    if(mW){ weight = mW[1]; matched = true; }
    const mR = t.match(/(\d+)\s*(?:회|번|개|reps?|RM)/i);
    if(mR){ reps = mR[1]; matched = true; }
    const mS = t.match(/(\d+)\s*(?:세트|셋트|sets?)/i);
    if(mS){ count = Math.min(20, Math.max(1, parseInt(mS[1],10))); matched = true; }

    // "20 x 12 x 3" / "20*12*3" 처럼 단위 없이 쓴 경우
    if(!matched){
      const mX = t.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)(?:\s*[x×*]\s*(\d+))?/i);
      if(mX){
        weight = mX[1]; reps = mX[2];
        if(mX[3]) count = Math.min(20, Math.max(1, parseInt(mX[3],10)));
        matched = true;
      }
    }
    if(matched && (weight!==null || reps!==null)){
      const label = t.replace(/\s+/g,' ');
      for(let i=0;i<count;i++) sets.push({weight: weight??'', reps: reps??'', src:label});
    }else{
      methodLines.push(t);
    }
  });
  return {sets, method: methodLines.join('\n')};
}
function ptPlanSummary(plan){
  if(!plan) return '';
  if(!plan.sets.length) return (plan.method||'').split('\n')[0].slice(0,40);
  const g = {};
  plan.sets.forEach(x=>{ const k = `${x.weight||'-'}|${x.reps||'-'}`; g[k]=(g[k]||0)+1; });
  return Object.entries(g).map(([k,n])=>{
    const [w,r] = k.split('|');
    return `${w!=='-'?w+'kg ':''}${r!=='-'?r+'회':''} × ${n}세트`.trim();
  }).join(' · ');
}
async function savePtPlan(exId, plan){
  const list = (state.ptPlans[exId] || []).filter(p=>p.id!==plan.id);
  list.push(plan);
  state.ptPlans[exId] = list;
  lsSave();
}
async function deletePtPlan(exId, planId){
  state.ptPlans[exId] = (state.ptPlans[exId]||[]).filter(p=>p.id!==planId);
  lsSave();
}

/* ---- 한 줄에서 무게·횟수·세트수 읽기 ----
   "2.5kg x 15번", "빈봉 x 12번", "10kg 15회 3세트", "20 x 12 x 3" 등.
   횟수가 없으면 세트가 아니라 설명으로 본다("무게는 33kg 고정" 같은 줄). */
function parseSetLine(line){
  const t = String(line||'').replace(/^[-–•*]\s*/, '').trim();
  if(!t) return null;
  let weight = null, reps = null, count = 1;
  if(/빈\s*봉|맨몸|bodyweight/i.test(t)) weight = '빈봉';
  const mW = t.match(/(\d+(?:\.\d+)?)\s*(?:kg|KG|Kg|킬로|㎏)/);
  if(mW) weight = mW[1];
  const mR = t.match(/(\d+)\s*(?:번|회|개|reps?)/i);
  if(mR) reps = mR[1];
  const mS = t.match(/(\d+)\s*(?:세트|셋트|sets?)/i);
  if(mS) count = Math.min(30, Math.max(1, parseInt(mS[1],10)));
  if(reps === null){
    const mX = t.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)(?:\s*[x×*]\s*(\d+))?/i);
    if(mX){
      if(weight === null) weight = mX[1];
      reps = mX[2];
      if(mX[3]) count = Math.min(30, Math.max(1, parseInt(mX[3],10)));
    }
  }
  if(reps === null) return null;         // 횟수가 없으면 세트로 치지 않는다
  return {weight, reps, count};
}

/* ---- 루틴 원문을 루틴 여러 개 / 운동 블록으로 쪼개기 ----
   선생님마다 형식이 다르다. 두 가지를 모두 읽는다.
     (가) 운동 이름은 그냥 한 줄, 설명은 "1. …", 세트는 "- 10kg x 15번"
     (나) 운동 이름이 "2. 아웃타이", 설명도 "- …", 세트도 "- 40kg x 20번"
   그래서 번호가 붙은 줄이 운동 이름인지 설명인지를 내용으로 판단한다. */

// "아웃타이(힙 어브덕션)" 처럼 적어도 도감에서 찾도록 후보 이름을 여러 개 만든다
function nameCandidates(raw){
  const t = String(raw||'').trim();
  const out = [t];
  const noParen = t.replace(/[(（][^)）]*[)）]/g, ' ').trim();
  if(noParen && noParen!==t) out.push(noParen);
  const inParen = t.match(/[(（]([^)）]+)[)）]/);
  if(inParen) out.push(inParen[1].trim());
  return out.filter(Boolean);
}
function matchExerciseAny(raw){
  for(const c of nameCandidates(raw)){
    const id = matchExerciseByName(c);
    if(id) return id;
  }
  return null;
}
// 짧은 명사구인가 (문장이 아니라 운동 이름처럼 보이는가)
function looksLikeName(text){
  const t = String(text||'').trim();
  if(!t) return false;
  // 도감에 있는 이름이면 확실 — 단, 운동 이름이 문장 속에 섞인 경우는 제외한다
  if(t.split(/\s+/).length <= 3 && t.length <= 25 && matchExerciseAny(t)) return true;
  if(t.length > 20) return false;
  if(/(하기|주기|앉기|진행|만들고|맞추고|느낌|생각|정도|바라보기|않게|세팅한후|잡아주기)\s*$/.test(t)) return false;
  return t.split(/\s+/).length <= 4;
}
// 새 루틴이 시작되는 제목 줄인가 ("개인운동 상체 루틴", "하체 개인운동" …)
function looksLikeRoutineTitle(text){
  const t = String(text||'').trim();
  if(!t) return false;
  if(t.length <= 25 && matchExerciseAny(t)) return false;   // 운동 이름이면 제목이 아니다
  return /(루틴|운동|프로그램|데이|day)/i.test(t);
}

function finishItem(it){
  if(!it) return null;
  const noteText = it.notes.join(' ');
  const fixedW = noteText.match(/(\d+(?:\.\d+)?)\s*(?:kg|킬로|㎏)/);
  if(!it.sets.length){
    // "무게는 33kg 고정" + "각 그립마다 15개씩 … 총 5세트" 처럼 흩어져 적힌 경우 합친다
    const r = noteText.match(/(\d+)\s*(?:개|회|번)/);
    const c = noteText.match(/(\d+)\s*(?:세트|셋트)/);
    if(r && c){
      const n = Math.min(30, Math.max(1, parseInt(c[1],10)));
      for(let k=0;k<n;k++) it.sets.push({weight: fixedW? fixedW[1] : '', reps: r[1]});
    }
  }else if(fixedW){
    it.sets = it.sets.map(x=> x.weight===''? {...x, weight:fixedW[1]} : x);
  }
  it.exId = matchExerciseAny(it.rawName);
  return it;
}

/* 한 루틴 안의 줄들을 운동으로 쪼갠다.
   줄 하나하나를 추측하지 않고, 그 루틴이 어떤 형식인지 먼저 정한다.
     - 아무 표시 없는 줄로 운동 이름을 적었으면(형식 가) → 번호 줄은 전부 설명
     - 그런 줄이 없으면(형식 나) → 번호 줄이 운동 이름 */
function parseRoutineChunk(name, lines){
  const routine = {name: name || '선생님 루틴', items: [], notes: []};
  const isSetLine = t => !!parseSetLine(t.replace(/^(?:\d{1,2}\s*[.)](?!\d)|[-–•*])\s*/, ''));
  const bareNames = lines.filter(t =>
    !/^\d{1,2}\s*[.)](?!\d)/.test(t) && !/^[-–•*]/.test(t) && !isSetLine(t));
  const numberedAreNames = bareNames.length === 0;

  let item = null;
  const push = ()=>{ if(item) routine.items.push(finishItem(item)); item = null; };
  const start = nm =>{ push(); item = {rawName:nm, exId:null, sets:[], steps:[], notes:[]}; };

  lines.forEach(t=>{
    const numbered = t.match(/^(\d{1,2})\s*[.)](?!\d)\s*(.*)$/);
    const bulleted = /^[-–•*]\s*/.test(t);
    const body = numbered ? numbered[2].trim() : t.replace(/^[-–•*]\s*/, '').trim();
    const set = parseSetLine(body);

    if(set){
      if(!item) start('(이름 없음)');
      for(let k=0;k<set.count;k++) item.sets.push({weight:set.weight ?? '', reps:set.reps ?? ''});
      return;
    }
    if(numbered){
      if(numberedAreNames && looksLikeName(body)) start(body);
      else if(item) item.steps.push(body);
      else routine.notes.push(body);
      return;
    }
    if(bulleted){
      if(item) item.notes.push(body);
      else routine.notes.push(body);
      return;
    }
    start(t);                                  // 표시 없는 줄 = 운동 이름
  });
  push();
  return routine;
}

// 원문 하나에 루틴이 여러 개 들어 있을 수 있다 → 루틴 배열을 돌려준다
function parseRoutinesText(text){
  const lines = String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  // 1단계: 제목 줄을 기준으로 루틴 덩어리로 자른다
  const chunks = [];
  let cur = null;
  lines.forEach((t, idx)=>{
    const plain = !/^\d{1,2}\s*[.)](?!\d)/.test(t) && !/^[-–•*]/.test(t);
    const isTitle = plain && (idx === 0 || looksLikeRoutineTitle(t));
    if(isTitle){ cur = {name:t, lines:[]}; chunks.push(cur); return; }
    if(!cur){ cur = {name:'선생님 루틴', lines:[]}; chunks.push(cur); }
    cur.lines.push(t);
  });
  // 2단계: 덩어리마다 형식을 판별해 파싱
  return chunks.map(c=>parseRoutineChunk(c.name, c.lines)).filter(r=>r.items.length);
}
// 예전 호출부 호환 — 첫 루틴만 돌려준다
function parseRoutineText(text){
  const rs = parseRoutinesText(text);
  return rs[0] || {name:'선생님 루틴', items:[], notes:[]};
}

/* ---- 루틴에 적힌 운동 이름을 도감 항목에 붙이기 ---- */
function normName(x){ return String(x||'').toLowerCase().replace(/[\s()\[\]·.,/-]/g,''); }
function matchExerciseByName(raw){
  const n = normName(raw);
  if(!n) return null;
  const pool = [];
  allExercises().forEach(e=>{
    pool.push([normName(e.name), e.id]);
    (e.alias||[]).forEach(a=>pool.push([normName(a), e.id]));
    if(typeof EX_EN!=='undefined' && EX_EN[e.id]) pool.push([normName(EX_EN[e.id]), e.id]);
  });
  for(const [k,id] of pool) if(k===n) return id;
  const long = pool.filter(([k])=>k.length>=3).sort((a,b)=>b[0].length-a[0].length);
  for(const [k,id] of long) if(n.startsWith(k) || k.startsWith(n)) return id;
  for(const [k,id] of long) if(n.includes(k) || k.includes(n)) return id;
  return null;
}
function routineSummary(r){
  const n = r.items.length;
  const sets = r.items.reduce((a,x)=>a+x.sets.length,0);
  return `운동 ${n}개 · 총 ${sets}세트`;
}
function itemSummary(it){
  if(!it.sets.length) return '세트 지정 없음';
  const g = {};
  it.sets.forEach(x=>{ const k=`${x.weight||'-'}|${x.reps||'-'}`; g[k]=(g[k]||0)+1; });
  return Object.entries(g).map(([k,c])=>{
    const [w,rp]=k.split('|');
    return `${w!=='-'? (w==='빈봉'?'빈봉 ':w+'kg ') : ''}${rp!=='-'? rp+'회':''} ×${c}`.trim();
  }).join(' · ');
}

}

  draft:null,        // 열려 있는 하루 기록의 편집 중 사본 (저장 눌러야 반영)
  draftDate:null,
  dirty:false,
  favLoaded:false,
  month:new Date(),
  selectedDate:null,
  pickerSelection:new Set(),
};

// 운동으로 '기록됐다'고 볼 수 있는가 — 종류만 눌러둔 건 기록이 아니다.
function workoutLogged(log){
  const w = log && log.workout;
  if(!w || !w.type || w.type==='none') return false;
  return !!(w.durationMin || w.memo || (Array.isArray(w.exercises) && w.exercises.length));
}
function pad2(n){return String(n).padStart(2,'0');}
function fmtDate(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function todayStr(){return fmtDate(new Date());}
function emptyMeal(){ return {text:'', time:''}; }
function emptyLog(date){
  return {date, workout:{type:'none',durationMin:'',exercises:[],memo:''},
           diet:{breakfast:emptyMeal(), lunch:emptyMeal(), dinner:emptyMeal(), snacks:[], memo:''},
           water:{ml:0,goal:2000}, protein:{g:0}, supplementsTaken:[],
           inbody:null};
}
// 예전 저장본은 끼니가 문자열이고 간식이 하나였다. 새 구조로 올려준다.
function normalizeMeal(v){
  if(v && typeof v==='object') return {text:v.text||'', time:v.time||''};
  return {text: v? String(v):'', time:''};
}
function normalizeDiet(raw){
  const d = raw || {};
  let snacks = Array.isArray(d.snacks) ? d.snacks.map(normalizeMeal) : [];
  if(!snacks.length && d.snack) snacks = [normalizeMeal(d.snack)];
  return {
    breakfast: normalizeMeal(d.breakfast), lunch: normalizeMeal(d.lunch),
    dinner: normalizeMeal(d.dinner), snacks, memo: d.memo||'',
  };
}
function emptySet(){ return {reps:'', weight:'', failed:false, failReason:''}; }
function normalizeSet(x){
  const s = (x && typeof x==='object') ? x : {};
  return {reps:s.reps??'', weight:s.weight??'', failed:!!s.failed, failReason:s.failReason||''};
}
// 저장된 기록을 현재 스키마로 맞춘다. 예전 버전이 쓴 문서(workout.exerciseIds)나
// 필드가 빠진 문서를 열어도 화면이 깨지지 않게 하기 위한 이관/보정 단계.
function normalizeLog(raw, date){
  const base = emptyLog(date || (raw && raw.date));
  if(!raw || typeof raw!=='object') return base;
  const w = raw.workout || {};
  let exercises = Array.isArray(w.exercises) ? w.exercises : null;
  if(!exercises){
    const ids = Array.isArray(w.exerciseIds) ? w.exerciseIds : [];
    exercises = ids.map(id=>({id, warmupSets:[], workSets:[emptySet()]}));
  }
  exercises = exercises.filter(e=>e && e.id).map(e=>({
    id: e.id,
    mode: e.mode==='pt' ? 'pt' : 'mine',      // 선생님 운동법대로 / 내 방식대로
    ptPlanId: e.ptPlanId || null,             // 따라한 선생님 운동법
    note: e.note || '',                       // 운동 중 메모
    warmupSets: (Array.isArray(e.warmupSets) ? e.warmupSets : []).map(normalizeSet),
    workSets: (Array.isArray(e.workSets) && e.workSets.length ? e.workSets : [emptySet()]).map(normalizeSet),
  }));
  return {
    ...base, ...raw,
    date: date || raw.date || base.date,
    workout: {type: w.type||'none', durationMin: w.durationMin??'', memo: w.memo??'', exercises},
    diet: normalizeDiet(raw.diet),
    water: {...base.water, ...(raw.water||{})},
    protein: {g: Number(raw.protein && raw.protein.g) || 0},
    supplementsTaken: Array.isArray(raw.supplementsTaken) ? raw.supplementsTaken : [],
    inbody: (raw.inbody && typeof raw.inbody==='object') ? raw.inbody : null,
  };
}
function getLog(date){
  // 하루 기록 모달이 열려 있는 날짜는 '저장 전 사본'을 본다 (저장 눌러야 실제 반영)
  if(state.draft && date===state.draftDate) return state.draft;
  const l = state.logs[date];
  return l ? normalizeLog(l, date) : emptyLog(date);
}

let saveTimer=null;
// patch: partial log fields to merge. opts.refresh=true re-renders the open day sheet
// immediately (use for button/toggle actions); leave false (default) for free-typing
// inputs so the field the user is typing in never loses focus.
function queueSave(date, patch, opts={}){
  const cur = getLog(date);
  const merged = {...cur, ...patch, date};
  // 편집 중인 날짜라면 사본만 바꾸고, 달력·서버에는 손대지 않는다.
  if(state.draft && date===state.draftDate){
    state.draft = merged;
    markDirty(true);
    if(opts.refresh) renderDaySheet(date);
    return;
  }
  state.logs[date]=merged;
  renderCalendar();
  if(opts.refresh) renderDayIfOpen(date);
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent='저장 중…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>persist(date, merged), 350);
}
const LS_KEY = 'fitlog.v1';
let lsWarned = false;
function lsSave(){
  const payload = {
    v:1,
    logs: state.logs,
    supplements: state.supplements,
    customExercises: state.customExercises,
    exImages: state.exImages,
    ptPlans: state.ptPlans,
    ptRoutines: state.ptRoutines,
    suppOrder: state.suppOrder,
    favorites: [...state.favorites],
    savedAt: new Date().toISOString(),
  };
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
    return true;
  }catch(err){
    if(!lsWarned){ lsWarned = true; showToast('저장 공간에 쓸 수 없어요. 백업을 받아두세요.'); }
    return false;
  }
}
function lsLoad(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(err){ return null; }
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(err){ return null; }
}
async function persist(date, data){
  const ok = lsSave();
  if(!ok){
    const statusEl = document.getElementById('saveStatus');
    if(statusEl) statusEl.textContent = '저장 실패 — 백업 필요';
  }
}
async function addSupplement(name, ds){
  const id = 'sup-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  state.supplements.push({id, name});
  lsSave();
  if(ds){
    const cur = getLog(ds);
    queueSave(ds, {supplementsTaken:[...cur.supplementsTaken, id]});
  }
  renderSupplementChips();
}

const SEED_LOGS = {};

async function initDb(){
  const saved = lsLoad();
  if(saved){
    Object.entries(saved.logs||{}).forEach(([d,l])=>{ state.logs[d] = normalizeLog(l, d); });
    state.supplements = Array.isArray(saved.supplements)? saved.supplements : [];
    state.customExercises = Array.isArray(saved.customExercises)? saved.customExercises : [];
    state.exImages = (saved.exImages && typeof saved.exImages==='object')? saved.exImages : {};
    state.ptPlans = (saved.ptPlans && typeof saved.ptPlans==='object')? saved.ptPlans : {};
    state.ptRoutines = Array.isArray(saved.ptRoutines)? saved.ptRoutines : [];
    state.suppOrder = Array.isArray(saved.suppOrder)? saved.suppOrder : [];
    if(Array.isArray(saved.favorites)) state.favorites = new Set(saved.favorites);
  }else{
    // 첫 실행: 아티팩트 버전에 들어 있던 인바디 기록을 그대로 옮겨온다
    Object.entries(SEED_LOGS).forEach(([d,l])=>{ state.logs[d] = normalizeLog(l, d); });
    lsSave();
  }
  state.favLoaded = true;
  renderCalendar();
  renderLibrary();
  renderSupplementChips();
  const v = document.querySelector('.tab-btn.active')?.dataset.view;
  if(v==='inbody') renderInbodyTab();
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = '';
}

/* ---- 백업 내보내기 / 복원 ---- */
function exportData(){
  const payload = lsLoad() || {v:1, logs:state.logs, supplements:state.supplements,
    customExercises:state.customExercises, exImages:state.exImages, favorites:[...state.favorites]};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitlog-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('백업 파일을 내려받았어요');
}
function importData(text, mode){
  let data;
  try{ data = JSON.parse(text); }
  catch(err){ showToast('JSON 형식이 아니에요'); return false; }
  if(!data || typeof data!=='object' || !data.logs){ showToast('핏로그 백업 파일이 아니에요'); return false; }
  if(mode==='replace'){ state.logs = {}; state.supplements = []; state.customExercises = []; state.exImages = {}; }
  Object.entries(data.logs||{}).forEach(([d,l])=>{ state.logs[d] = normalizeLog(l, d); });
  (data.supplements||[]).forEach(s=>{ if(s && s.id && !state.supplements.some(x=>x.id===s.id)) state.supplements.push(s); });
  (data.customExercises||[]).forEach(e=>{ if(e && e.id && !state.customExercises.some(x=>x.id===e.id)) state.customExercises.push(e); });
  Object.assign(state.exImages, data.exImages||{});
  Object.assign(state.ptPlans, data.ptPlans||{});
  (data.ptRoutines||[]).forEach(r=>{ if(r && r.id && !state.ptRoutines.some(x=>x.id===r.id)) state.ptRoutines.push(r); });
  if(Array.isArray(data.suppOrder) && data.suppOrder.length) state.suppOrder = data.suppOrder;
  if(Array.isArray(data.favorites)) state.favorites = new Set(data.favorites);
  lsSave();
  renderCalendar(); renderLibrary(); renderSupplementChips();
  const v = document.querySelector('.tab-btn.active')?.dataset.view;
  if(v==='inbody') renderInbodyTab();
  showToast(`기록 ${Object.keys(data.logs||{}).length}일치를 불러왔어요`);
  return true;
}
function storageInfo(){
  const raw = (()=>{ try{ return localStorage.getItem(LS_KEY)||''; }catch(e){ return ''; } })();
  const kb = (new Blob([raw]).size/1024).toFixed(1);
  const saved = lsLoad();
  const days = saved? Object.keys(saved.logs||{}).length : Object.keys(state.logs).length;
  return {kb, days, savedAt: saved && saved.savedAt};
}
function openDataModal(){
  const info = storageInfo();
  document.getElementById('dataBody').innerHTML = `
    <div class="storage-note">
      기록은 이 브라우저(홈화면 앱)에만 저장돼요. 현재 <b>${info.days}일치 · ${info.kb}KB</b>${
        info.savedAt? ` · 마지막 저장 ${info.savedAt.slice(0,16).replace('T',' ')}`:''}.<br>
      기기를 바꾸거나 사파리 데이터를 지우면 사라지니, 가끔 백업 파일을 받아두는 게 안전해요.
    </div>
    <div class="field-row" style="margin-top:16px"><button class="primary-btn" id="dataExport">백업 파일 내보내기</button></div>
    <h4 style="margin:22px 0 6px;font-size:14px">백업 복원</h4>
    <div class="field-row"><input type="file" id="dataFile" accept="application/json,.json"></div>
    <div class="field-row" style="margin-top:8px"><textarea id="dataPaste" rows="4" placeholder="또는 백업 JSON 내용을 붙여넣기"></textarea></div>
    <div class="field-row" style="margin-top:8px;gap:10px">
      <button class="ghost-btn" id="dataMerge">지금 기록에 합치기</button>
      <button class="ghost-btn" id="dataReplace" style="border-color:var(--supp);color:var(--supp)">전부 덮어쓰기</button>
    </div>`;
  const body = document.getElementById('dataBody');
  let pendingText = '';
  body.querySelector('#dataExport').addEventListener('click', exportData);
  body.querySelector('#dataFile').addEventListener('change', async ev=>{
    const f = ev.target.files && ev.target.files[0];
    if(f){ pendingText = await f.text(); showToast('파일을 읽었어요. 합치기/덮어쓰기를 눌러주세요'); }
  });
  const run = mode => {
    const text = pendingText || document.getElementById('dataPaste').value;
    if(!text.trim()){ showToast('백업 파일이나 내용을 먼저 넣어주세요'); return; }
    if(importData(text, mode)) closeDataModal();
  };
  body.querySelector('#dataMerge').addEventListener('click', ()=>run('merge'));
  body.querySelector('#dataReplace').addEventListener('click', ()=>run('replace'));
  document.getElementById('dataOverlay').classList.add('open');
}
function closeDataModal(){ document.getElementById('dataOverlay').classList.remove('open'); }

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');

/* =========================================================
   바텀시트가 열리면 뒤 화면 스크롤 잠그기
   ========================================================= */
let scrollLockY = 0;
function updateBodyScrollLock(){
  const anyOpen = document.querySelector('.overlay.open') != null;
  const locked = document.body.classList.contains('modal-open');
  if(anyOpen && !locked){
    scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.top = `-${scrollLockY}px`;
    document.body.classList.add('modal-open');
  }else if(!anyOpen && locked){
    document.body.classList.remove('modal-open');
    document.body.style.top = '';
    window.scrollTo(0, scrollLockY);
  }
}
// 시트를 여닫는 곳이 여러 군데라, 각 호출부를 고치는 대신 class 변화를 지켜본다
(function watchOverlays(){
  const obs = new MutationObserver(updateBodyScrollLock);
  document.querySelectorAll('.overlay').forEach(el=>
    obs.observe(el, {attributes:true, attributeFilter:['class']}));
  updateBodyScrollLock();
})();

/* =========================================================
   calendar
   ========================================================= */
const DOW_KEYS=['sun','mon','tue','wed','thu','fri','sat'];
function renderWeekStrip(){
  const now=new Date();
  const day=now.getDay();
  const start=new Date(now); start.setDate(now.getDate()-day);
  let workouts=0, waterSum=0, waterDays=0;
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const log=state.logs[fmtDate(d)];
    if(workoutLogged(log)) workouts++;
    if(log && log.water && log.water.ml>0){ waterSum+=log.water.ml; waterDays++; }
  }
  const avgWater = waterDays? Math.round(waterSum/waterDays):0;
  document.getElementById('weekStrip').innerHTML =
    `<span>이번 주 운동 <b>${workouts}</b>회</span><span>물 평균 <b>${avgWater?  (avgWater/1000).toFixed(1)+'L':'—'}</b></span>`;
}

function renderCalendar(){
  const m = state.month;
  const y = m.getFullYear(), mo = m.getMonth();
  document.getElementById('calTitle').textContent = `${y}년 ${mo+1}월`;
  const firstDow = new Date(y,mo,1).getDay();
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const daysInPrev = new Date(y,mo,0).getDate();
  const cells=[];
  for(let i=firstDow-1;i>=0;i--) cells.push({d:daysInPrev-i, outside:true, month:mo-1});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, outside:false, month:mo});
  while(cells.length%7!==0 || cells.length<42) cells.push({d:cells.length- (firstDow+daysInMonth) +1, outside:true, month:mo+1});

  const grid = document.getElementById('calGrid');
  grid.innerHTML='';
  const todayS = todayStr();
  cells.forEach(c=>{
    const realDate = new Date(y, c.outside ? c.month : mo, c.d);
    const ds = fmtDate(realDate);
    const cell = document.createElement('div');
    cell.className='day-cell'+(c.outside?' outside':'')+(ds===todayS?' today':'')+(ds===state.selectedDate?' selected':'');
    const log = state.logs[ds];
    // 칸이 좁아서 점은 3개까지만 찍고 나머지는 +N 으로 줄인다.
    const marks = [];
    let mins='';
    if(log){
      // 종류만 눌러둔 날은 아무 표시도 하지 않는다 (실수로 누른 게 기록처럼 보이면 안 됨)
      if(workoutLogged(log)){
        const w = log.workout;
        marks.push({c: w.type==='pt' ? 'var(--pt)' : 'var(--accent)', t: w.type==='pt' ? 'PT':'개인운동'});
        if(w.durationMin) mins=w.durationMin+'분';
      }
      const d = log.diet;
      const hasDiet = d && (
        (d.breakfast && d.breakfast.text) || (d.lunch && d.lunch.text) || (d.dinner && d.dinner.text) ||
        (Array.isArray(d.snacks) && d.snacks.some(sn=>sn && sn.text)) ||
        (typeof d.breakfast==='string' && (d.breakfast||d.lunch||d.dinner||d.snack)));
      if(hasDiet) marks.push({c:'var(--diet)', t:'식단'});
      if(log.protein && log.protein.g>0) marks.push({c:'var(--protein)', t:'단백질'});
      if(log.water && log.water.ml>0) marks.push({c:'var(--water)', t:'물'});
      if(log.supplementsTaken && log.supplementsTaken.length) marks.push({c:'var(--supp)', t:'영양제'});
      if(log.inbody) marks.push({c:'var(--inbody)', t:'인바디'});
    }
    // 좁은 화면은 칸이 작아 점 2개까지만 (그 이상은 +N)
    const MAX_DOTS = window.innerWidth <= 480 ? 2 : 3;
    const shown = marks.slice(0, MAX_DOTS);
    const rest = marks.length - shown.length;
    const dots = shown.map(m=>`<i class="dot" style="background:${m.c}"></i>`).join('')
      + (rest > 0 ? `<span class="dot-more">+${rest}</span>` : '');
    cell.title = marks.map(m=>m.t).join(' · ');
    cell.innerHTML = `<span class="day-num">${c.d}</span><div class="day-dots">${dots}</div><span class="day-mins">${mins}</span>`;
    cell.addEventListener('click', ()=>openDay(ds));
    grid.appendChild(cell);
  });
  renderWeekStrip();
}
