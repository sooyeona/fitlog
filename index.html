/* =========================================================
   day sheet
   ========================================================= */
function markDirty(on){
  state.dirty = !!on;
  const btn = document.getElementById('daySave');
  btn.classList.toggle('dirty', state.dirty);
  btn.disabled = !state.dirty;
  document.getElementById('saveStatus').textContent = state.dirty ? '저장 안 된 변경사항' : '';
  if(!state.dirty) document.getElementById('dayDirtyBar').hidden = true;
}
function openDay(ds){
  state.selectedDate = ds;
  // 저장 전 편집 사본을 만든다. 이 사본을 고치는 동안 달력과 저장된 기록은 그대로다.
  state.draftDate = ds;
  state.draft = JSON.parse(JSON.stringify(normalizeLog(state.logs[ds], ds)));
  state.sectionEdit = {};   // 열 때는 요약부터 보여준다
  const [y,mo,d] = ds.split('-').map(Number);
  const dow = ['일','월','화','수','목','금','토'][new Date(y,mo-1,d).getDay()];
  document.getElementById('dayTitle').textContent = `${mo}월 ${d}일 (${dow})`;
  document.getElementById('dayDirtyBar').hidden = true;
  // 시트를 먼저 띄운 뒤 그린다. 기록 데이터에 예상치 못한 값이 있어도
  // '아무 반응 없음' 대신 최소한 시트는 열리고 상황을 알려준다.
  document.getElementById('dayOverlay').classList.add('open');
  try{
    renderDaySheet(ds);
  }catch(err){
    document.getElementById('daySheetBody').innerHTML =
      `<div class="empty-note" style="padding:20px 0">이 날짜의 기록을 표시하는 중 문제가 생겼어요.<br><small>${String(err && err.message || err)}</small></div>`;
  }
  markDirty(false);
  renderCalendar();
}
// 저장: 사본을 실제 기록으로 확정한다.
function saveDay(opts={}){
  if(!state.draft) return;
  const ds = state.draftDate;
  const data = state.draft;
  state.logs[ds] = data;
  persist(ds, data);
  markDirty(false);
  state.sectionEdit = {};        // 저장 후에는 요약으로 접는다
  renderDayIfOpen(ds);
  renderCalendar();
  if(!opts.silent) showToast('저장했어요');
}
function closeDay(opts={}){
  if(state.dirty && !opts.force){
    document.getElementById('dayDirtyBar').hidden = false;
    return;
  }
  document.getElementById('dayOverlay').classList.remove('open');
  document.getElementById('dayDirtyBar').hidden = true;
  state.selectedDate=null;
  state.draft=null; state.draftDate=null;
  markDirty(false);
  renderCalendar();
}
document.getElementById('daySave').addEventListener('click', ()=>saveDay());
document.getElementById('dirtySave').addEventListener('click', ()=>{ saveDay({silent:true}); closeDay({force:true}); showToast('저장하고 닫았어요'); });
document.getElementById('dirtyDiscard').addEventListener('click', ()=>{ closeDay({force:true}); showToast('변경사항을 버렸어요'); });
document.getElementById('dayClose').addEventListener('click', ()=>closeDay());
document.getElementById('dayOverlay').addEventListener('click', e=>{ if(e.target.id==='dayOverlay') closeDay(); });

function renderDayIfOpen(ds){
  if(state.selectedDate===ds && document.getElementById('dayOverlay').classList.contains('open')){
    renderDaySheet(ds);
  }
}

function saveSuppOrder(){ lsSave(); }
// 기본 목록 순서 그대로 놓고, 직접 추가한 것은 뒤에 붙인다.
// (예전에 끌어서 저장해 둔 순서가 남아 있어도 무시한다 — 드래그 기능은 없앴다.)
function orderedSupplements(){
  return [
    ...COMMON_SUPPLEMENTS.map(n=>({key:n, label:n})),
    ...state.supplements.map(x=>({key:x.id, label:x.name})),
  ];
}
/* 영양제 칩 — 탭으로 켜고 끈다. 순서는 기본 목록 순서로 고정. */
function renderSupplementChips(){
  const body = document.getElementById('daySheetBody');
  const wrap = body && body.querySelector('#suppChipRow');
  if(!wrap || !state.selectedDate) return;
  const log = getLog(state.selectedDate);
  const chips = orderedSupplements().map(x=>{
    const on = log.supplementsTaken.includes(x.key);
    return `<span class="chip ${on?'on':''}" data-supp="${x.key}">${x.label}</span>`;
  }).join('');
  wrap.innerHTML = chips + `<span class="chip add-chip" id="suppAddChip">기타 (직접 입력)</span>`;
  wrap.querySelectorAll('[data-supp]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.supp;
      const cur = getLog(state.selectedDate);
      const set = new Set(cur.supplementsTaken);
      set.has(id) ? set.delete(id) : set.add(id);
      queueSave(state.selectedDate, {supplementsTaken:[...set]});
      el.classList.toggle('on');
    });
  });
  const addChip = wrap.querySelector('#suppAddChip');
  if(addChip) addChip.addEventListener('click', ()=>{
    const nameBox = body.querySelector('#suppNewBox');
    nameBox.style.display = nameBox.style.display==='flex' ? 'none':'flex';
    if(nameBox.style.display==='flex') nameBox.querySelector('input').focus();
  });
}

/* 기록이 있는 구역은 기본으로 요약만 보여주고, '편집'을 눌러야 입력칸이 펼쳐진다.
   입력칸이 화면을 다 잡아먹지 않게 하기 위한 것. */
function hasWorkoutContent(log){
  const w = log.workout;
  return !!(w && w.type && w.type!=='none' &&
    (w.durationMin || w.memo || (w.exercises && w.exercises.length)));
}
function hasDietContent(log){
  const d = log.diet;
  return !!(d && ((d.breakfast&&d.breakfast.text) || (d.lunch&&d.lunch.text) ||
    (d.dinner&&d.dinner.text) || (d.snacks||[]).some(x=>x&&x.text)));
}
function isEditing(key, hasContent){
  const v = state.sectionEdit[key];
  return v === undefined ? !hasContent : v;   // 내용이 없으면 바로 편집 상태
}
function sectionHeadHtml(color, title, key, hasContent, editing){
  const btn = hasContent
    ? `<button class="sec-edit" data-secedit="${key}">${editing ? '접기' : '편집'}</button>`
    : '';
  return `<div class="section-head"><i class="dot" style="background:${color}"></i><h4>${title}</h4>${btn}</div>`;
}
function setLineText(x){
  const w = x.weight===''||x.weight==null ? '' : (x.weight==='빈봉' ? '빈봉' : x.weight+'kg');
  const r = x.reps===''||x.reps==null ? '' : x.reps+'회';
  return [r, w].filter(Boolean).join(' × ') || '—';
}
function workoutSummaryHtml(log){
  const w = log.workout;
  const kind = w.type==='pt' ? 'PT' : '개인운동';
  const head = `<div class="sum-top"><span class="sum-kind" style="background:${w.type==='pt'?'var(--pt)':'var(--accent)'}">${kind}</span>${
    w.durationMin ? `<span class="sum-dur">${w.durationMin}분</span>` : ''}</div>`;
  const exs = (w.exercises||[]).map(en=>{
    const ex = getEx(en.id);
    if(!ex) return '';
    const rows = []
      .concat((en.warmupSets||[]).map((x,i)=>({n:'W'+(i+1), x})))
      .concat((en.workSets||[]).map((x,i)=>({n:(i+1)+'세트', x})))
      .filter(r=> r.x.reps!=='' || r.x.weight!=='' || r.x.failed);
    return `<div class="sum-ex">
      <div class="sum-ex-name">${ex.name}${en.mode==='pt'? ` <span class="sum-tag">선생님</span>`:''}</div>
      ${rows.length ? `<div class="sum-sets">${rows.map(r=>
        `<div class="sum-set${r.x.failed?' failed':''}"><span class="n">${r.n}</span><span class="v">${setLineText(r.x)}</span>${
          r.x.failed ? `<span class="fx">실패${r.x.failReason? ' · '+r.x.failReason.replace(/</g,'&lt;') : ''}</span>` : ''}</div>`
      ).join('')}</div>` : `<div class="sum-empty">세트 기록 없음</div>`}
      ${en.note ? `<div class="sum-note">${en.note.replace(/</g,'&lt;')}</div>` : ''}
    </div>`;
  }).join('');
  return head + (exs || `<div class="sum-empty">선택한 운동 없음</div>`)
    + (w.memo ? `<div class="sum-note">메모 · ${w.memo.replace(/</g,'&lt;')}</div>` : '');
}
function dietSummaryHtml(log){
  const d = log.diet;
  const rows = [['아침',d.breakfast],['점심',d.lunch],['저녁',d.dinner]]
    .concat((d.snacks||[]).map((sn,i)=>[`간식${(d.snacks.length>1)?' '+(i+1):''}`, sn]))
    .filter(([,m])=> m && m.text);
  if(!rows.length) return `<div class="sum-empty">기록 없음</div>`;
  return `<div class="sum-meals">${rows.map(([lab,m])=>
    `<div class="sum-meal"><span class="lab">${lab}</span><span class="tm">${m.time||''}</span><span class="tx">${m.text.replace(/</g,'&lt;')}</span></div>`
  ).join('')}</div>`;
}

function renderDaySheet(ds){
  const log = getLog(ds);
  const body = document.getElementById('daySheetBody');
  const waterPct = Math.min(100, Math.round((log.water.ml/log.water.goal)*100));
  const wHas = hasWorkoutContent(log), dHas = hasDietContent(log);
  const wEdit = isEditing('workout', wHas), dEdit = isEditing('diet', dHas);
  // 편집 중이면 그 상태를 붙잡아 둔다 — 운동을 추가해 내용이 생겼다고 도중에 접히면 안 된다
  if(wEdit) state.sectionEdit.workout = true;
  if(dEdit) state.sectionEdit.diet = true;

  body.innerHTML = `
    <div class="section">
      ${sectionHeadHtml('var(--accent)','운동','workout', wHas, wEdit)}
      ${!wEdit ? workoutSummaryHtml(log) : `
      <div class="segmented" id="wtSeg">
        <button data-v="none" class="${log.workout.type==='none'?'active':''}">안 함</button>
        <button data-v="personal" class="${log.workout.type==='personal'?'active':''}">개인운동</button>
        <button data-v="pt" class="${log.workout.type==='pt'?'active':''}">PT</button>
      </div>
      <div id="wtDetail" style="${log.workout.type==='none'?'display:none':''}">
        <div class="field-row">
          <label>운동 시간</label>
          <input type="number" min="0" id="wtDuration" placeholder="분" value="${log.workout.durationMin||''}">
        </div>
        <div id="exCardsWrap">${renderExerciseCards(log)}</div>
        <div class="field-row" style="margin-top:12px">
          <button class="pick-btn" id="openPicker">+ 운동 선택하기 (목록에서 고르기)</button>
        </div>
        <div class="field-row">
          <label>메모</label>
          <input type="text" id="wtMemo" placeholder="컨디션, 특이사항 등" value="${log.workout.memo||''}">
        </div>
      </div>`}
    </div>

    <div class="section">
      ${sectionHeadHtml('var(--diet)','식단','diet', dHas, dEdit)}
      ${!dEdit ? dietSummaryHtml(log) : `
      ${[['breakfast','아침'],['lunch','점심'],['dinner','저녁']].map(([k,lab])=>`
      <div class="meal-row">
        <label>${lab}</label>
        <input type="time" class="meal-time" data-meal="${k}" value="${log.diet[k].time||''}">
        <input type="text" class="meal-text" data-meal="${k}" placeholder="무엇을 드셨나요?" value="${(log.diet[k].text||'').replace(/"/g,'&quot;')}">
      </div>`).join('')}
      ${log.diet.snacks.map((sn,i)=>`
      <div class="snack-row">
        <label>간식${log.diet.snacks.length>1? ' '+(i+1):''}</label>
        <input type="time" class="snack-time" data-idx="${i}" value="${sn.time||''}">
        <input type="text" class="snack-text" data-idx="${i}" placeholder="무엇을 드셨나요?" value="${(sn.text||'').replace(/"/g,'&quot;')}">
        <button class="snack-del" data-snackdel="${i}" aria-label="간식 삭제">✕</button>
      </div>`).join('')}
      <button class="add-line-btn" id="addSnack">+ 간식 추가</button>`}
    </div>

    <div class="section">
      <div class="section-head"><i class="dot" style="background:var(--supp)"></i><h4>영양제</h4></div>
      <div class="chip-row" id="suppChipRow"></div>
      <div class="field-row" id="suppNewBox" style="display:none">
        <input type="text" id="suppNewInput" placeholder="영양제 이름을 직접 입력 (예: 밀크씨슬)">
        <button class="pick-btn" style="width:auto;white-space:nowrap" id="suppNewConfirm">추가</button>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><i class="dot" style="background:var(--protein)"></i><h4>단백질</h4></div>
      <div class="water-row prot-row">
        <button class="water-btn prot-btn" data-g="1">+1g</button>
        <button class="water-btn prot-btn" data-g="5">+5g</button>
        <button class="water-btn prot-btn" data-g="10">+10g</button>
        <button class="water-btn prot-btn" data-g="20">+20g</button>
        <span class="water-total"${log.protein.g? ' style="color:var(--protein)"':''}>${log.protein.g}<span style="font-size:12px;color:var(--text-faint)"> g</span></span>
      </div>
      <div class="water-goal">쉐이크·프로틴바 등 따로 챙겨 먹은 양${log.protein.g? ` · <a href="#" id="protReset" style="color:var(--text-faint)">초기화</a>` : ''}</div>
    </div>

    <div class="section">
      <div class="section-head"><i class="dot" style="background:var(--water)"></i><h4>물</h4></div>
      <div class="water-row">
        <button class="water-btn" data-ml="100">+100ml</button>
        <button class="water-btn" data-ml="250">+250ml</button>
        <button class="water-btn" data-ml="500">+500ml</button>
        <span class="water-total">${(log.water.ml/1000).toFixed(2)}<span style="font-size:12px;color:var(--text-faint)"> L</span></span>
      </div>
      <div class="water-bar"><i style="width:${waterPct}%"></i></div>
      <div class="water-goal">목표 ${(log.water.goal/1000).toFixed(1)}L 중 ${waterPct}% · <a href="#" id="waterReset" style="color:var(--text-faint)">초기화</a></div>
    </div>

    <div class="section">
      <div class="section-head"><i class="dot" style="background:var(--inbody)"></i><h4>인바디</h4></div>
      <div style="font-size:13px;color:var(--text-muted)">
        ${log.inbody ? `체중 ${log.inbody.weight??'—'}kg · 체지방률 ${log.inbody.bodyFatPct??'—'}% · 인바디점수 ${log.inbody.score??'—'}점` : '이 날 측정한 인바디 기록이 없어요.'}
      </div>
      <div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">
        <span class="ib-link" id="gotoInbodyTab">인바디 탭에서 ${log.inbody?'수정':'추가'}하기 →</span>
        <span class="ib-link" id="gotoCsvImport">CSV로 가져오기</span>
      </div>
    </div>
  `;

  // 구역 펼치기 / 접기
  body.querySelectorAll('[data-secedit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.secedit;
      state.sectionEdit[k] = !isEditing(k, k==='workout' ? hasWorkoutContent(log) : hasDietContent(log));
      renderDaySheet(ds);
    });
  });

  // 운동 세그먼트
  body.querySelectorAll('#wtSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = getLog(ds).workout;
      // 이미 선택된 항목을 다시 누르면 해제된다(잘못 눌렀을 때 바로 되돌리기).
      const next = (cur.type===btn.dataset.v && btn.dataset.v!=='none') ? 'none' : btn.dataset.v;
      queueSave(ds, {workout:{...cur, type:next}}, {refresh:true});
    });
  });
  const wtDur = body.querySelector('#wtDuration');
  if(wtDur) wtDur.addEventListener('input', e=>queueSave(ds,{workout:{...getLog(ds).workout, durationMin:e.target.value}}));
  const wtMemo = body.querySelector('#wtMemo');
  if(wtMemo) wtMemo.addEventListener('input', e=>queueSave(ds,{workout:{...getLog(ds).workout, memo:e.target.value}}));
  const openPickerBtn = body.querySelector('#openPicker');
  if(openPickerBtn) openPickerBtn.addEventListener('click', ()=>openPicker(ds));
  wireExerciseCards(ds, body);

  // 식단 — 끼니별 시간 + 간식 여러 개
  const patchMeal = (key, field, value)=>{
    const d = getLog(ds).diet;
    queueSave(ds, {diet:{...d, [key]:{...d[key], [field]:value}}});
  };
  body.querySelectorAll('.meal-text').forEach(inp=>
    inp.addEventListener('input', e=>patchMeal(inp.dataset.meal, 'text', e.target.value)));
  body.querySelectorAll('.meal-time').forEach(inp=>
    inp.addEventListener('change', e=>patchMeal(inp.dataset.meal, 'time', e.target.value)));
  const patchSnack = (i, field, value)=>{
    const d = getLog(ds).diet;
    const snacks = d.snacks.map((sn,j)=> j===i ? {...sn, [field]:value} : sn);
    queueSave(ds, {diet:{...d, snacks}});
  };
  body.querySelectorAll('.snack-text').forEach(inp=>
    inp.addEventListener('input', e=>patchSnack(Number(inp.dataset.idx), 'text', e.target.value)));
  body.querySelectorAll('.snack-time').forEach(inp=>
    inp.addEventListener('change', e=>patchSnack(Number(inp.dataset.idx), 'time', e.target.value)));
  body.querySelectorAll('[data-snackdel]').forEach(btn=>btn.addEventListener('click', ()=>{
    const d = getLog(ds).diet;
    queueSave(ds, {diet:{...d, snacks:d.snacks.filter((_,j)=>j!==Number(btn.dataset.snackdel))}}, {refresh:true});
  }));
  const addSnackBtn = body.querySelector('#addSnack');
  if(addSnackBtn) addSnackBtn.addEventListener('click', ()=>{
    const d = getLog(ds).diet;
    queueSave(ds, {diet:{...d, snacks:[...d.snacks, emptyMeal()]}}, {refresh:true});
  });

  // 영양제
  renderSupplementChips();
  const suppConfirm = body.querySelector('#suppNewConfirm');
  if(suppConfirm) suppConfirm.addEventListener('click', ()=>{
    const inp = body.querySelector('#suppNewInput');
    const v = inp.value.trim();
    if(v){ addSupplement(v, ds); inp.value=''; body.querySelector('#suppNewBox').style.display='none'; }
  });

  // 단백질
  body.querySelectorAll('.prot-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = getLog(ds);
      queueSave(ds, {protein:{g: (cur.protein.g||0) + Number(btn.dataset.g)}}, {refresh:true});
    });
  });
  const protReset = body.querySelector('#protReset');
  if(protReset) protReset.addEventListener('click', e=>{
    e.preventDefault();
    queueSave(ds, {protein:{g:0}}, {refresh:true});
  });

  // 물
  body.querySelectorAll('.water-btn:not(.prot-btn)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = getLog(ds);
      queueSave(ds, {water:{...cur.water, ml:cur.water.ml+Number(btn.dataset.ml)}}, {refresh:true});
    });
  });
  body.querySelector('#waterReset').addEventListener('click', e=>{
    e.preventDefault();
    queueSave(ds, {water:{...getLog(ds).water, ml:0}}, {refresh:true});
  });

  // 인바디 → 탭 이동 / CSV 가져오기
  const gotoBtn = body.querySelector('#gotoInbodyTab');
  if(gotoBtn) gotoBtn.addEventListener('click', ()=>{
    if(state.dirty) saveDay({silent:true});
    closeDay({force:true});
    switchTab('inbody');
    openInbodyEntry(ds);
  });
  const gotoCsv = body.querySelector('#gotoCsvImport');
  if(gotoCsv) gotoCsv.addEventListener('click', ()=>{
    if(state.dirty) saveDay({silent:true});
    closeDay({force:true});
    switchTab('inbody');
    openCsvImport();
  });
}

/* =========================================================
   exercise cards (sets logging) inside the day sheet
   ========================================================= */
function renderExerciseCards(log){
  if(!log.workout.exercises.length) return `<div class="empty-note" style="padding:6px 0">아직 선택한 운동이 없어요.</div>`;
  return log.workout.exercises.map(entry=>{
    const ex = getEx(entry.id);
    if(!ex) return '';
    const color = PARTS[ex.part].color;
    const warmup = entry.warmupSets||[];
    const work = entry.workSets||[];
    return `
    <div class="ex-set-card" data-exid="${entry.id}">
      <div class="ex-set-head">
        <div class="ex-set-thumb" style="background:${color}22">${exThumbHtml(ex, color, 'ex-set-noicon')}</div>
        <div class="ex-set-titlewrap">
          <span class="ex-set-name" data-detail="${entry.id}">${ex.name}</span>
          <span class="ex-set-muscle">${ex.equip} · ${ex.muscle}</span>
        </div>
        <button class="ex-set-remove" data-removeex="${entry.id}" aria-label="운동 삭제">✕</button>
      </div>
      <div class="mode-seg" data-modeseg="${entry.id}">
        <button data-mode="mine" class="${entry.mode!=='pt'?'on':''}">내 방식대로</button>
        <button data-mode="pt" class="${entry.mode==='pt'?'on':''}">선생님 운동법</button>
      </div>
      ${ptHintHtml(entry)}
      ${warmup.length? `<div class="set-group-label">웜업</div>
      <div class="set-rows">${warmup.map((s,i)=>setRow(entry.id,'warmupSets',i,s,'W')).join('')}</div>` : ''}
      <button class="set-add-btn" data-addset="${entry.id}" data-kind="warmupSets">+ 웜업 세트 추가</button>
      <div class="set-group-label">세트 <span style="font-weight:500;color:var(--text-faint)">· ✕를 누르면 실패로 표시돼요</span></div>
      <div class="set-rows">${work.map((s,i)=>setRow(entry.id,'workSets',i,s,i+1)).join('')}</div>
      <button class="set-add-btn" data-addset="${entry.id}" data-kind="workSets">+ 세트 추가</button>
      <div class="ex-note-row">
        <label>운동 중 메모 — 뭐가 잘 됐고 뭐가 힘들었는지</label>
        <input type="text" class="ex-note" data-noteex="${entry.id}" placeholder="예) 마지막 세트 팔꿈치 아파서 무게 낮춤" value="${(entry.note||'').replace(/"/g,'&quot;')}">
      </div>
    </div>`;
  }).join('');
}
// 선생님 운동법을 따르는 중이면 그 지시를 카드 안에서 바로 보여준다.
function ptHintHtml(entry){
  if(entry.mode!=='pt') return '';
  const plan = (entry.ptPlanId && ptPlanById(entry.id, entry.ptPlanId)) || latestPtPlan(entry.id);
  if(!plan) return `<div class="pt-hint">선생님 운동법이 아직 없어요.
      <button class="apply" data-openpt="${entry.id}">입력하러 가기</button></div>`;
  return `<div class="pt-hint">
      <span><b>${plan.date}</b> · ${ptPlanSummary(plan) || '설명만'}</span>
      <button class="apply" data-applypt="${entry.id}" data-planid="${plan.id}">이대로 세트 채우기</button>
      <button class="apply" data-openpt="${entry.id}">자세히</button>
    </div>${plan.method? `<div class="pt-method" style="font-size:12.5px;margin:0 0 8px">${plan.method.replace(/</g,'&lt;')}</div>`:''}`;
}
function setRow(exId, kind, idx, s, label){
  const failed = !!s.failed;
  return `<div class="set-row" data-exid="${exId}" data-kind="${kind}" data-idx="${idx}">
    <span class="set-idx">${typeof label==='number'?label+'세트':label}</span>
    <input type="number" inputmode="numeric" placeholder="회" class="set-reps" value="${s.reps??''}">
    <span class="set-x">×</span>
    <input type="number" inputmode="decimal" placeholder="kg" class="set-kg" value="${s.weight??''}">
    <button class="set-fail-btn ${failed?'on':''}" data-failset="${exId}" data-kind3="${kind}" data-idx3="${idx}" title="${failed?'실패 해제':'실패로 표시'}">✕</button>
    <button class="set-del" data-delset="${exId}" data-kind2="${kind}" data-idx2="${idx}" aria-label="세트 삭제">−</button>
  </div>
  ${failed? `<div class="set-fail-reason"><input type="text" class="set-fail-why" data-exid2="${exId}" data-kind4="${kind}" data-idx4="${idx}" placeholder="왜 못 했는지 (예: 마지막 2회 못 듦, 어깨 통증)" value="${(s.failReason||'').replace(/"/g,'&quot;')}"></div>`:''}`;
}
function mutateExercise(ds, exId, fn){
  const cur = getLog(ds);
  const list = cur.workout.exercises.map(e=>{
    if(e.id!==exId) return e;
    const copy = {...e, warmupSets:[...(e.warmupSets||[])], workSets:[...(e.workSets||[])]};
    return fn(copy);
  });
  queueSave(ds, {workout:{...cur.workout, exercises:list}});
}
function wireExerciseCards(ds, body){
  body.querySelectorAll('[data-detail]').forEach(el=>{
    el.addEventListener('click', ()=>openExerciseDetail(el.dataset.detail));
  });
  body.querySelectorAll('[data-removeex]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = getLog(ds);
      const list = cur.workout.exercises.filter(e=>e.id!==btn.dataset.removeex);
      queueSave(ds, {workout:{...cur.workout, exercises:list}}, {refresh:true});
    });
  });
  body.querySelectorAll('[data-addset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.dataset.kind;
      mutateExercise(ds, btn.dataset.addset, e=>{ e[kind]=[...e[kind], emptySet()]; return e; });
      renderDaySheet(ds);
    });
  });
  body.querySelectorAll('[data-delset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.dataset.kind2, idx=Number(btn.dataset.idx2);
      mutateExercise(ds, btn.dataset.delset, e=>{ e[kind]=e[kind].filter((_,i)=>i!==idx); return e; });
      renderDaySheet(ds);
    });
  });
  body.querySelectorAll('.set-row').forEach(row=>{
    const exId=row.dataset.exid, kind=row.dataset.kind, idx=Number(row.dataset.idx);
    row.querySelector('.set-reps').addEventListener('input', e=>{
      mutateExercise(ds, exId, ex=>{ ex[kind][idx]={...ex[kind][idx], reps:e.target.value}; return ex; });
    });
    row.querySelector('.set-kg').addEventListener('input', e=>{
      mutateExercise(ds, exId, ex=>{ ex[kind][idx]={...ex[kind][idx], weight:e.target.value}; return ex; });
    });
  });
  // 실패 표시 토글 + 사유
  body.querySelectorAll('[data-failset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind=btn.dataset.kind3, idx=Number(btn.dataset.idx3);
      mutateExercise(ds, btn.dataset.failset, ex=>{
        const cur = ex[kind][idx];
        ex[kind][idx] = {...cur, failed: !cur.failed, failReason: cur.failed ? '' : (cur.failReason||'')};
        return ex;
      });
      renderDaySheet(ds);
    });
  });
  body.querySelectorAll('.set-fail-why').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const kind=inp.dataset.kind4, idx=Number(inp.dataset.idx4);
      mutateExercise(ds, inp.dataset.exid2, ex=>{ ex[kind][idx]={...ex[kind][idx], failReason:e.target.value}; return ex; });
    });
  });
  // 운동 중 메모
  body.querySelectorAll('.ex-note').forEach(inp=>{
    inp.addEventListener('input', e=>{
      mutateExercise(ds, inp.dataset.noteex, ex=>{ ex.note = e.target.value; return ex; });
    });
  });
  // 내 방식 / 선생님 방식
  body.querySelectorAll('[data-modeseg] button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.closest('[data-modeseg]').dataset.modeseg;
      mutateExercise(ds, exId, ex=>{ ex.mode = btn.dataset.mode; return ex; });
      renderDaySheet(ds);
    });
  });
  body.querySelectorAll('[data-applypt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.applypt;
      const plan = ptPlanById(exId, btn.dataset.planid);
      if(!plan) return;
      mutateExercise(ds, exId, ex=>{
        ex.ptPlanId = plan.id;
        ex.workSets = plan.sets.length ? plan.sets.map(x=>({reps:x.reps||'', weight:x.weight||'', failed:false, failReason:''})) : ex.workSets;
        return ex;
      });
      renderDaySheet(ds);
      showToast('선생님 지정 세트로 채웠어요');
    });
  });
  body.querySelectorAll('[data-openpt]').forEach(btn=>{
    btn.addEventListener('click', ()=>openExerciseDetailPt(btn.dataset.openpt));
  });
}

let routineView = null;   // 목록에서 하나를 열면 그 id

// 지금 루틴 목록을 그려야 할 칸 — 운동 선택 모달의 탭이거나, 도감에서 연 모달이거나.

      <div style="font-size:12px;color:var(--text-faint);font-family:var(--font-mono);margin:2px 0 12px">${r.date} · ${routineSummary(r)}</div>
      ${(r.notes && r.notes.length) ? `<div class="pt-empty" style="padding:12px 14px;margin-bottom:14px">${r.notes.join('\n').replace(/</g,'&lt;').split('\n').join('<br>')}</div>` : ''}
      ${r.items.map((it,i)=>{
        const ex = it.exId ? getEx(it.exId) : null;
        return `<div class="rt-item">
          <div class="hd"><span class="nm">${it.rawName}</span><span class="sum">${itemSummary(it)}</span></div>
          ${ex ? `<div style="font-size:12px;color:var(--text-faint);margin-top:4px">→ 도감의 <b>${ex.name}</b>에 연결됨</div>`
               : `<div class="warn">도감에서 못 찾은 운동이에요. 아래에서 골라주세요.</div>`}
          <select data-rtmap="${i}">
            <option value="">${ex? '연결 바꾸기…' : '운동 고르기…'}</option>
            ${allExercises().map(e=>`<option value="${e.id}" ${e.id===it.exId?'selected':''}>${e.name}</option>`).join('')}
          </select>
          ${it.steps.length? `<div class="steps">${it.steps.map((x,j)=>`${j+1}. ${x}`).join('\n').replace(/</g,'&lt;')}</div>`:''}
          ${it.notes.length? `<div class="steps" style="color:var(--text-faint)">${it.notes.join('\n').replace(/</g,'&lt;')}</div>`:''}
        </div>`;
      }).join('')}
      <div class="pt-actions">
        <button class="primary-btn" id="rtApply">이 루틴으로 오늘 기록 채우기</button>
        <button class="ghost-btn" id="rtEdit">수정</button>
        <button class="ghost-btn" id="rtDel" style="border-color:var(--supp);color:var(--supp);flex:0 0 auto;min-width:0;padding:0 14px">삭제</button>
      </div>`;
    pane.querySelector('#rtBack').addEventListener('click', ()=>{ routineView=null; renderPickerRoutinePane(); });
    pane.querySelectorAll('[data-rtmap]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const i = Number(sel.dataset.rtmap);
        const cur = routineById(routineView);
        cur.items[i].exId = sel.value || null;
        await saveRoutine({...cur});
        renderPickerRoutinePane();
      });
    });
    pane.querySelector('#rtApply').addEventListener('click', ()=>applyRoutineToDay(r));
    pane.querySelector('#rtEdit').addEventListener('click', ()=>openRoutineEditor(r));
    pane.querySelector('#rtDel').addEventListener('click', async ()=>{
      await deleteRoutine(r.id); routineView=null; renderPickerRoutinePane(); showToast('루틴을 삭제했어요');
    });
    return;
  }

  pane.innerHTML = `<button class="pick-btn" id="rtNew" style="margin-bottom:14px">+ 선생님 루틴 붙여넣기</button>`
    + (list.length
      ? list.map(r=>`<button class="rt-card" data-rtopen="${r.id}">
          <span class="mid"><span class="nm">${r.name}</span><span class="meta">${r.date} · ${routineSummary(r)}</span></span>
          <span class="chev">›</span></button>`).join('')
      : `<div class="pt-empty">아직 등록한 선생님 루틴이 없어요.<br>카톡으로 받은 루틴을 그대로 붙여넣으면
          운동별로 무게·횟수·세트를 나눠서 정리해둘게요. 여러 루틴을 한꺼번에 붙여넣어도 돼요.</div>`);
  pane.querySelectorAll('[data-rtopen]').forEach(b=>b.addEventListener('click', ()=>{
    routineView = b.dataset.rtopen; renderPickerRoutinePane();

/* ---- 루틴을 그날 운동 기록으로 옮기기 ---- */
function applyRoutineToDay(r){
  const mapped = r.items.filter(it=>it.exId);
  if(!mapped.length){ showToast('연결된 운동이 없어요. 먼저 운동을 골라주세요'); return; }
  const pickerEl = document.getElementById('pickerOverlay');
  const pickerOpen = pickerEl.classList.contains('open');
  const ds = (pickerOpen && pickerEl.dataset.forDate) || state.draftDate || todayStr();
  // 도감에서 바로 눌렀다면 그날 기록을 먼저 연다 (편집 사본이 있어야 저장 흐름이 맞는다)
  if(pickerOpen) closePicker();
  document.getElementById('routineListOverlay').classList.remove('open');
  if(!state.draft || state.draftDate!==ds){ switchTab('calendar'); openDay(ds); }
  const cur = getLog(ds);
  const existing = Object.fromEntries(cur.workout.exercises.map(e=>[e.id,e]));
  const list = mapped.map(it=>{
    const prev = existing[it.exId] || {};
    return {
      id: it.exId, mode:'pt', ptPlanId:null, routineId:r.id, note: prev.note||'',
      warmupSets: prev.warmupSets || [],
      workSets: it.sets.length ? it.sets.map(x=>({reps:x.reps||'', weight:x.weight||'', failed:false, failReason:''}))
                               : [emptySet()],
    };
  });
  const keep = cur.workout.exercises.filter(e=>!mapped.some(it=>it.exId===e.id));
  queueSave(ds, {workout:{...cur.workout,
    type: cur.workout.type==='none' ? 'personal' : cur.workout.type,
    exercises:[...keep, ...list]}}, {refresh:true});
  showToast(`${mapped.length}개 운동을 채웠어요 · 저장을 눌러주세요`);
}

/* ---- 붙여넣기 등록/수정 ---- */
function openRoutineEditor(existing){
  const body = document.getElementById('routineBody');
  document.getElementById('routineTitle').textContent = existing ? '선생님 루틴 수정' : '선생님 루틴 등록';
  body.innerHTML = `
    <div class="field-row"><label>받은 날짜</label><input type="date" id="rtDate" value="${existing? existing.date : todayStr()}"></div>
    <div class="field-row" style="margin-top:10px"><label>루틴 이름</label><input type="text" id="rtName" placeholder="예: 개인운동 상체 루틴" value="${existing? existing.name.replace(/"/g,'&quot;') : ''}"></div>
    <h4 style="margin:18px 0 6px;font-size:14px">받은 내용 그대로 붙여넣기</h4>
    <textarea id="rtRaw" rows="10" placeholder="개인운동 상체 루틴&#10;&#10;빨간색 인클라인 프레스&#10;1. 손잡이 기준 좌석은 겨드랑이 바로 아래&#10;- 2.5kg x 15번&#10;- 2.5kg x 12번&#10;&#10;빨간색 로우&#10;...">${existing? (existing.raw||'').replace(/</g,'&lt;') : ''}</textarea>
    <div class="pt-parse-preview" id="rtPreview"></div>
    <div class="pt-actions">
      <button class="primary-btn" id="rtSave">저장</button>
      <button class="ghost-btn" id="rtCancel">취소</button>
    </div>`;
  const raw = body.querySelector('#rtRaw'), prev = body.querySelector('#rtPreview');
  const refresh = ()=>{
    const rs = parseRoutinesText(raw.value);
    if(!rs.length){ prev.textContent = '아직 운동을 찾지 못했어요. 운동 이름을 한 줄에 하나씩 적고, 그 아래에 세트를 적어주세요.'; return; }
    const nameBox = body.querySelector('#rtName');
    nameBox.disabled = rs.length > 1;
    nameBox.placeholder = rs.length > 1 ? '루틴마다 원문의 제목을 그대로 씁니다' : (rs[0].name || '');
    prev.innerHTML = (rs.length > 1 ? `<b>루틴 ${rs.length}개</b>로 나눠서 저장돼요<br>` : '')
      + rs.map(r=>`${rs.length>1 ? `<b>${r.name}</b> — 운동 ${r.items.length}개<br>` : `<b>운동 ${r.items.length}개</b>로 정리돼요<br>`}`
        + r.items.map(it=>{
            const ex = it.exId ? getEx(it.exId) : null;
            return `&nbsp;· ${it.rawName} — ${itemSummary(it)}${ex? '' : ' <span style="color:var(--supp)">(도감 연결 필요)</span>'}`;
          }).join('<br>')).join('<br><br>');
  };
  raw.addEventListener('input', refresh); refresh();
  body.querySelector('#rtCancel').addEventListener('click', closeRoutineEditor);
  body.querySelector('#rtSave').addEventListener('click', async ()=>{
    const text = raw.value.trim();
    if(!text){ showToast('내용을 붙여넣어 주세요'); return; }
    const parsed = parseRoutinesText(text);
    if(!parsed.length){ showToast('운동을 찾지 못했어요'); return; }
    const date = body.querySelector('#rtDate').value || todayStr();
    const typedName = body.querySelector('#rtName').value.trim();
    let lastId = null;
    for(let k=0;k<parsed.length;k++){
      const pr = parsed[k];
      const r = {
        id: (existing && existing.id && parsed.length===1)
              ? existing.id
              : 'rt-'+Date.now()+'-'+k+'-'+Math.random().toString(36).slice(2,5),
        name: (parsed.length===1 ? (typedName || pr.name) : pr.name),
        date, raw: text, items: pr.items, notes: pr.notes || [],
        updatedAt: new Date().toISOString(),
      };
      await saveRoutine(r);
      lastId = r.id;
    }
    closeRoutineEditor();
    routineView = parsed.length===1 ? lastId : null;
    renderPickerRoutinePane();
    showToast(parsed.length>1 ? `루틴 ${parsed.length}개를 저장했어요` : '루틴을 저장했어요');
  });
  document.getElementById('routineOverlay').classList.add('open');
}

function renderPickerList(query){
  const q = query.trim().toLowerCase();
  const list = document.getElementById('pickerList');
  const mine = myRoutine().filter(e=>e.name.toLowerCase().includes(q));
  const custom = state.customExercises.filter(e=>!isFav(e.id) && e.name.toLowerCase().includes(q));
  let html='';
  if(mine.length){
    html += `<div class="picker-part">★ 내가 자주 하는 운동</div>`;
    mine.forEach(e=>html+=pickerRow(e));
  }
  if(custom.length){
    html += `<div class="picker-part">직접 추가한 운동</div>`;
    custom.forEach(e=>html+=pickerRow(e));
  }
  PART_ORDER.forEach(p=>{
    const items = EXERCISES.filter(e=>e.part===p && e.name.toLowerCase().includes(q));
    if(!items.length) return;
    html += `<div class="picker-part">${PARTS[p].label}</div>`;
    items.forEach(e=>html+=pickerRow(e));
  });
  list.innerHTML = html || `<div class="empty-note">검색 결과가 없어요.</div>`;
  list.querySelectorAll('.picker-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.id;
      state.pickerSelection.has(id) ? state.pickerSelection.delete(id) : state.pickerSelection.add(id);
      row.classList.toggle('checked');
      row.querySelector('.box').textContent = state.pickerSelection.has(id) ? '✓' : '';
    });
  });
  wireFavButtons(list);
}
function pickerRow(e){
  const on = state.pickerSelection.has(e.id);
  return `<div class="picker-row ${on?'checked':''}" data-id="${e.id}">
    <span class="box">${on?'✓':''}</span>
    <span class="nm">${e.name}</span>
    <span class="mu">${e.equip}</span>
    ${hasPtPlan(e.id)? `<span class="rec-badge pt">쌤</span>`:''}
    ${favBtnHtml(e.id)}
  </div>`;
}

/* =========================================================
   exercise library view
   ========================================================= */
let activePartFilter = 'all';
function renderPartFilters(){
  const wrap = document.getElementById('partFilters');
  const allBtn = `<button class="part-chip ${activePartFilter==='all'?'active':''}" data-part="all" style="${activePartFilter==='all'?'background:var(--text);':''}">전체</button>`;
  const rest = PART_ORDER.map(p=>{
    const active = activePartFilter===p;
    return `<button class="part-chip ${active?'active':''}" data-part="${p}" style="${active?`background:${PARTS[p].color};`:''}">${PARTS[p].label}</button>`;
  }).join('');
  wrap.innerHTML = allBtn+rest;
  wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
    activePartFilter = b.dataset.part;
    renderLibrary();
  }));
}
function renderLibrary(){
  _loggedCache = null;
  const q = (document.getElementById('libSearch').value||'').trim().toLowerCase();
  const results = document.getElementById('libResults');
  let html='';
  if(activePartFilter==='all' && !q){
    const mine = myRoutine();
    html += `<div class="part-section"><div class="part-title"><i class="dot" style="background:var(--accent)"></i>★ 내가 자주 하는 운동</div>${
      mine.length
        ? `<div class="ex-list">${mine.map(exRow).join('')}</div>`
        : `<div class="empty-note" style="padding:16px 14px">아직 즐겨찾기한 운동이 없어요. 아래 목록에서 ☆ 를 누르면 여기에 모여요.</div>`
    }</div>`;
    const customOnly = state.customExercises.filter(e=>!isFav(e.id));
    if(customOnly.length){
      html += `<div class="part-section"><div class="part-title"><i class="dot" style="background:var(--text)"></i>직접 추가한 운동</div><div class="ex-list">${customOnly.map(exRow).join('')}</div></div>`;
    }
  }
  PART_ORDER.forEach(p=>{
    if(activePartFilter!=='all' && activePartFilter!==p) return;
    const items = allExercises().filter(e=>e.part===p && (e.name.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q)));
    if(!items.length) return;
    html += `<div class="part-section"><div class="part-title"><i class="dot" style="background:${PARTS[p].color}"></i>${PARTS[p].label}</div><div class="ex-list">${items.map(exRow).join('')}</div></div>`;
  });
  if(!html) html = `<div class="empty-note">검색 결과가 없어요.</div>`;
  results.innerHTML = html;
  results.querySelectorAll('[data-openex]').forEach(card=>{
    card.addEventListener('click', ()=>openExerciseDetail(card.dataset.openex));
  });
  wireFavButtons(results);
}

function renderPtPane(e){
  const pane = document.getElementById('exPanePt');

  if(!ptView.editing && !plans.length){
    pane.innerHTML = `<div class="pt-empty">아직 선생님이 알려준 운동법이 없어요.<br>

    pane.querySelector('#ptNew').addEventListener('click', ()=>{ ptView={exId:e.id, planId:null, editing:true}; renderPtPane(e); });
    return;
  }
  if(ptView.editing){
    const plan = ptView.planId ? ptPlanById(e.id, ptView.planId) : null;
    pane.innerHTML = `
      <div class="field-row"><label>받은 날짜</label><input type="date" id="ptDate" value="${plan? plan.date : todayStr()}"></div>
      <h4 style="margin:16px 0 6px;font-size:14px">선생님이 보내준 내용</h4>
      <textarea id="ptRaw" rows="6" placeholder="그대로 붙여넣으세요&#10;예) 인클라인 프레스 20kg 12회 4세트&#10;내릴 때 3초, 팔꿈치 45도 유지">${plan? (plan.raw||'').replace(/</g,'&lt;') : ''}</textarea>
      <div class="pt-parse-preview" id="ptPreview"></div>
      <div class="field-row" style="margin-top:12px"><label>메모</label><input type="text" id="ptMemo" placeholder="선택" value="${plan? (plan.memo||'').replace(/"/g,'&quot;') : ''}"></div>
      <div class="pt-actions">
        <button class="primary-btn" id="ptSave">저장</button>
        <button class="ghost-btn" id="ptCancel">취소</button>
      </div>`;
    const raw = pane.querySelector('#ptRaw');
    const preview = pane.querySelector('#ptPreview');
    const refresh = ()=>{
      const r = parsePtText(raw.value);
      preview.innerHTML = r.sets.length
        ? `이렇게 정리돼요 — <b>${r.sets.length}세트</b><br>${ptPlanSummary({sets:r.sets, method:r.method})}${r.method? `<br><span style="color:var(--text-faint)">방법: ${r.method.replace(/</g,'&lt;').split('\n').join(' / ')}</span>`:''}`
        : `아직 무게·횟수를 못 찾았어요. 숫자가 없으면 전부 '방법' 설명으로 저장돼요.`;
    };
    raw.addEventListener('input', refresh); refresh();
    pane.querySelector('#ptCancel').addEventListener('click', ()=>{ ptView={exId:e.id, planId:ptView.planId, editing:false}; renderPtPane(e); });
    pane.querySelector('#ptSave').addEventListener('click', async ()=>{
      const rawText = raw.value.trim();
      if(!rawText){ showToast('내용을 입력해주세요'); return; }
      const parsed = parsePtText(rawText);
      const saved = {
        id: (plan && plan.id) || 'pt-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
        date: pane.querySelector('#ptDate').value || todayStr(),
        raw: rawText, sets: parsed.sets, method: parsed.method,
        memo: pane.querySelector('#ptMemo').value || '',
        updatedAt: new Date().toISOString(),
      };
      await savePtPlan(e.id, saved);
      ptView = {exId:e.id, planId:saved.id, editing:false};
      renderPtPane(e);
      renderExTabCount(e);
      renderDayIfOpen(state.selectedDate);
      showToast('선생님 운동법을 저장했어요');
    });
    return;
  }
  const cur = ptPlanById(e.id, ptView.planId) || plans[0];
  ptView.planId = cur.id;
  pane.innerHTML = `
    <div class="pt-datebar">
      <select id="ptPlanSel">${plans.map(pl=>`<option value="${pl.id}" ${pl.id===cur.id?'selected':''}>${pl.date}${pl===plans[0]?' (최신)':''} · ${ptPlanSummary(pl)||'설명만'}</option>`).join('')}</select>
      <button class="ghost-btn" style="width:auto;padding:9px 14px" id="ptNew">+ 새로</button>
    </div>
    <div class="pt-plan">
      <h5>지정 세트 ${cur.sets.length? `· 총 ${cur.sets.length}세트` : ''}</h5>
      ${cur.sets.length ? ptSetsHtml(cur.sets) : `<div style="font-size:13px;color:var(--text-faint)">세트 지정 없음</div>`}
      ${cur.method ? `<div class="pt-method">${cur.method.replace(/</g,'&lt;')}</div>` : ''}
      ${cur.memo ? `<div class="pt-method" style="color:var(--text-muted)">메모: ${cur.memo.replace(/</g,'&lt;')}</div>` : ''}
    </div>
    <div class="pt-actions">
      <button class="primary-btn" id="ptApply">이대로 운동 기록에 넣기</button>
      <button class="ghost-btn" id="ptEdit">수정</button>
      <button class="ghost-btn" id="ptDel" style="border-color:var(--supp);color:var(--supp);flex:0 0 auto;min-width:0;padding:0 14px">삭제</button>
    </div>`;
  pane.querySelector('#ptPlanSel').addEventListener('change', ev=>{ ptView.planId = ev.target.value; renderPtPane(e); });
  pane.querySelector('#ptNew').addEventListener('click', ()=>{ ptView={exId:e.id, planId:null, editing:true}; renderPtPane(e); });
  pane.querySelector('#ptEdit').addEventListener('click', ()=>{ ptView={exId:e.id, planId:cur.id, editing:true}; renderPtPane(e); });
  pane.querySelector('#ptApply').addEventListener('click', ()=>applyPtPlanToDay(e.id, cur));
  pane.querySelector('#ptDel').addEventListener('click', async ()=>{
    await deletePtPlan(e.id, cur.id);
    ptView = {exId:e.id, planId:null, editing:false};
    renderPtPane(e); renderExTabCount(e);
    showToast('삭제했어요');
  });
}

// 선생님 운동법을 그날 운동 기록으로 옮긴다.
function applyPtPlanToDay(exId, plan){
  const ds = state.draftDate || todayStr();
  document.getElementById('exOverlay').classList.remove('open');
  if(!state.draft || state.draftDate!==ds) openDay(ds);
  const cur = getLog(ds);
  const sets = plan.sets.length ? plan.sets.map(x=>({reps:x.reps||'', weight:x.weight||'', failed:false, failReason:''})) : [emptySet()];
  const rest = cur.workout.exercises.filter(x=>x.id!==exId);
  const prev = cur.workout.exercises.find(x=>x.id===exId) || {};
  const entry = {id:exId, mode:'pt', ptPlanId:plan.id, note:prev.note||'', warmupSets:prev.warmupSets||[], workSets:sets};
  queueSave(ds, {workout:{...cur.workout, type: cur.workout.type==='none' ? 'personal' : cur.workout.type,
                          exercises:[...rest, entry]}}, {refresh:true});
  showToast('오늘 운동 기록에 넣었어요 · 저장을 눌러주세요');
}

function inbodyEntries(){
  return Object.values(state.logs)
    .filter(l=>l && l.inbody)
    .map(l=>({date:l.date, ...l.inbody}))
    .sort((a,b)=> a.date<b.date ? 1 : (a.date>b.date? -1 : 0));
}
function statTile(label,val,unit,delta){
  return `<div class="ib-stat-tile"><div class="label">${label}</div>
    <div class="value">${val??'—'}${val!=null?`<small> ${unit}</small>`:''}</div>
    <div class="delta">${delta||'&nbsp;'}</div></div>`;
}
function deltaStr(entriesDesc,key,decimals){
  const latest=entriesDesc[0], prev=entriesDesc[1];
  if(!prev || latest[key]==null || prev[key]==null) return '';
  const d = latest[key]-prev[key];
  if(Math.abs(d)<0.05) return '이전 기록과 동일';
  return (d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(decimals!=null?decimals:1)+' · 이전 기록 대비';
}

let ibDetailDate = null;
function fmtIbNum(v, dec){
  if(typeof v !== 'number') return String(v);
  return dec===0 ? String(Math.round(v)) : v.toFixed(dec).replace(/\.?0+$/,'') || String(v);
}
function openIbDetail(date){
  const entriesDesc = inbodyEntries();
  const idx = entriesDesc.findIndex(e=>e.date===date);
  if(idx<0) return;
  const cur = entriesDesc[idx];
  const prev = entriesDesc[idx+1]; // 바로 이전(더 오래된) 측정
  const [y,mo,d] = date.split('-');

      <div class="ibd-date">${idx===0? '최근 측정' : `${idx+1}번째 최근 기록`}${prev? ` · 이전 측정 ${prev.date} 대비` : ''}</div>
    </div>`;

  let shown = 0;
  Object.entries(IB_GROUPS).forEach(([g,gLabel])=>{
    const fields = IB_VALUE_FIELDS.filter(f=>f.group===g && cur[f.key]!=null && cur[f.key]!=='');

        const v = cur[f.key];
        let dlt = '';
        if(prev && typeof v==='number' && typeof prev[f.key]==='number'){
          const diff = v - prev[f.key];
          const step = f.dec===0 ? 0.5 : Math.pow(10,-f.dec)/2;
          dlt = Math.abs(diff)<step ? '—' : (diff>0?'▲ ':'▼ ')+fmtIbNum(Math.abs(diff), f.dec);

        return `<div class="ibd-row">
          <span class="k">${f.label}</span>
          <span><span class="v">${fmtIbNum(v, f.dec)}${f.unit?`<small> ${f.unit}</small>`:''}</span>${dlt?`<span class="dlt">${dlt}</span>`:''}</span>
        </div>`;
      }).join('')
    }</div></div>`;
  });

  if(cur.memo){
    html += `<div class="ibd-group"><h5>그 밖에 기록된 값 · 메모</h5><div class="ibd-memo">${cur.memo}</div></div>`;

function drawTrendChart(container, ascEntries, key, opts){
  const pts = ascEntries.filter(e=>typeof e[key]==='number');
  container.innerHTML = `<div class="ch-title">${opts.title}</div>`;
  if(!pts.length){ container.innerHTML += `<div class="ch-empty">기록 없음</div>`; return; }
  const last = pts[pts.length-1][key];
  container.innerHTML += `<div class="ch-value">${last.toFixed(opts.decimals)}<small> ${opts.unit}</small></div>`;
  const W=240,H=84,PAD=10;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  container.style.position='relative';
  container.appendChild(svg);

  if(pts.length===1){
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',W/2); c.setAttribute('cy',H/2); c.setAttribute('r',5);
    c.setAttribute('fill','var(--inbody)'); c.setAttribute('stroke','var(--surface)'); c.setAttribute('stroke-width','2');
    svg.appendChild(c);
    return;
  }
  const vals = pts.map(p=>p[key]);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min-=1; max+=1; }
  const pad=(max-min)*0.15; min-=pad; max+=pad;
  const coords = pts.map((p,i)=>({
    x: PAD + (i/(pts.length-1))*(W-PAD*2),
    y: H-8 - ((p[key]-min)/(max-min))*(H-16),
    date:p.date, val:p[key]
  }));
  const base=document.createElementNS(NS,'line');
  base.setAttribute('x1',PAD); base.setAttribute('x2',W-PAD); base.setAttribute('y1',H-8); base.setAttribute('y2',H-8);
  base.setAttribute('stroke','var(--line)'); base.setAttribute('stroke-width','1');
  svg.appendChild(base);

  const areaPath = `M${coords[0].x},${H-8} ` + coords.map(c=>`L${c.x},${c.y}`).join(' ') + ` L${coords[coords.length-1].x},${H-8} Z`;
  const area=document.createElementNS(NS,'path');
  area.setAttribute('d',areaPath); area.setAttribute('fill','var(--inbody)'); area.setAttribute('opacity','.12'); area.setAttribute('stroke','none');
  svg.appendChild(area);

  const linePath = coords.map((c,i)=>(i===0?'M':'L')+c.x+','+c.y).join(' ');
  const line=document.createElementNS(NS,'path');
  line.setAttribute('d',linePath); line.setAttribute('fill','none'); line.setAttribute('stroke','var(--inbody)');
  line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linejoin','round'); line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  const endC=coords[coords.length-1];
  const endDot=document.createElementNS(NS,'circle');
  endDot.setAttribute('cx',endC.x); endDot.setAttribute('cy',endC.y); endDot.setAttribute('r',5);
  endDot.setAttribute('fill','var(--inbody)'); endDot.setAttribute('stroke','var(--surface)'); endDot.setAttribute('stroke-width','2');
  svg.appendChild(endDot);

  const cross=document.createElementNS(NS,'line');
  cross.setAttribute('y1',4); cross.setAttribute('y2',H-8); cross.setAttribute('stroke','var(--text-faint)'); cross.setAttribute('stroke-width','1'); cross.setAttribute('opacity','0');
  svg.appendChild(cross);
  const hoverDot=document.createElementNS(NS,'circle');
  hoverDot.setAttribute('r',5); hoverDot.setAttribute('fill','var(--inbody)'); hoverDot.setAttribute('stroke','var(--surface)'); hoverDot.setAttribute('stroke-width','2'); hoverDot.setAttribute('opacity','0');
  svg.appendChild(hoverDot);

  const tip=document.createElement('div');
  tip.className='ib-tooltip';
  container.appendChild(tip);

  svg.addEventListener('mousemove', ev=>{
    const rect = svg.getBoundingClientRect();
    const relX = (ev.clientX-rect.left)/rect.width*W;
    let nearest=coords[0], nd=Infinity;
    coords.forEach(c=>{ const d=Math.abs(c.x-relX); if(d<nd){nd=d; nearest=c;} });
    cross.setAttribute('x1',nearest.x); cross.setAttribute('x2',nearest.x); cross.setAttribute('opacity','.6');
    hoverDot.setAttribute('cx',nearest.x); hoverDot.setAttribute('cy',nearest.y); hoverDot.setAttribute('opacity','1');
    const [,mo,d]=nearest.date.split('-');
    tip.textContent = `${mo}/${d} · ${nearest.val}${opts.unit}`;
    tip.style.left = (nearest.x/W*100)+'%';
    tip.style.top = (nearest.y/H*100)+'%';
    tip.classList.add('show');
  });
  svg.addEventListener('mouseleave', ()=>{
    cross.setAttribute('opacity','0'); hoverDot.setAttribute('opacity','0'); tip.classList.remove('show');
  });
}

// ---- CSV import ----
function parseCSVText(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const IB_FIELD_ALIASES = Object.fromEntries(IB_FIELDS.map(f=>[f.key, f.aliases]));
const IB_IGNORE_HEADERS = ['측정장비','device','deviceid','기기'];
// 괄호 안 단위는 통째로 떼고 비교한다. '체중(kg)' -> '체중', 'BMI(kg/m²)' -> 'bmi'
function normHeader(h){
  return String(h||'').replace(/\([^)]*\)/g,'').toLowerCase().replace(/[\s%._\-\[\]㎡²°]/g,'');
}
// 1차: 완전일치 / 2차: 긴 별칭 우선 부분일치(앞부분만). '오른팔 근육량'이 '근육량'으로
// 잘못 잡히지 않도록 includes 대신 startsWith 를 쓴다.
const IB_ALIAS_PAIRS = IB_FIELDS
  .flatMap(f=>f.aliases.map(a=>({key:f.key, an:normHeader(a)})))
  .filter(p=>p.an.length>=2)
  .sort((a,b)=> b.an.length - a.an.length);
function matchIbField(header){
  const n = normHeader(header);
  if(!n) return null;
  for(const p of IB_ALIAS_PAIRS){ if(n===p.an) return p.key; }
  for(const p of IB_ALIAS_PAIRS){
    if(p.an.length>=3 && (n.startsWith(p.an) || p.an.startsWith(n))) return p.key;
  }
  return null;
}
function isIgnoredIbHeader(header){
  const n = normHeader(header);
  return IB_IGNORE_HEADERS.some(a=>n===normHeader(a));
}
function parseIbDate(s){
  const t=String(s||'').trim();
  // pure-digit timestamp, e.g. 20260905130838 (YYYYMMDDhhmmss) or 20260905 (YYYYMMDD)
  const digitsOnly = t.match(/^\d{8,14}$/);
  if(digitsOnly){
    const y=t.slice(0,4), mo=t.slice(4,6), d=t.slice(6,8);
    if(+mo>=1 && +mo<=12 && +d>=1 && +d<=31) return `${y}-${mo}-${d}`;
  }
  let m=t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
  m=t.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/);
  if(m) return `${m[3]}-${pad2(+m[1])}-${pad2(+m[2])}`;
  return null;
}
function parseInbodyCsv(text){
  const rows = parseCSVText(text.trim());
  if(!rows.length) return {ok:false, error:'내용이 비어 있어요.'};
  const header = rows[0];
  const colMap = header.map(matchIbField);
  const dateIdx = colMap.indexOf('date');
  if(dateIdx===-1) return {ok:false, error:'날짜 열을 찾지 못했어요. 헤더에 "날짜" 또는 "date" 열이 있는지 확인해주세요.'};
  const parsed=[], skipped=[];
  rows.slice(1).forEach((r,idx)=>{
    if(r.every(c=>c.trim()==='')) return;
    const date = parseIbDate(r[dateIdx]);
    if(!date){ skipped.push(`${idx+2}행: 날짜 인식 실패 ("${r[dateIdx]||''}")`); return; }
    const entry={date}; const unmatched=[];
    header.forEach((h,ci)=>{
      if(ci===dateIdx) return;
      const val=(r[ci]||'').trim();
      if(!val || val==='-' || val.toLowerCase()==='n/a') return; // no reading for this field
      if(isIgnoredIbHeader(h)) return; // device id etc. — not useful to keep
      const key=colMap[ci];
      if(key){ const num=Number(val.replace(/[^0-9.\-]/g,'')); entry[key]= isNaN(num)? val : num; }
      else unmatched.push(`${h.replace(/\(.*?\)/g,'').trim()}: ${val}`);
    });
    if(unmatched.length) entry.memo = unmatched.join(', ');
    parsed.push(entry);
  });
  return {ok:true, header, colMap, parsed, skipped};
}
let ibPendingImport = null;
function openCsvImport(){
  document.getElementById('ibCsvFile').value='';
  document.getElementById('ibCsvPaste').value='';
  document.getElementById('ibCsvPreviewWrap').innerHTML='';
  ibPendingImport=null;
  document.getElementById('ibImportOverlay').classList.add('open');
}
function closeCsvImport(){ document.getElementById('ibImportOverlay').classList.remove('open'); }
document.getElementById('ibImportBtn').addEventListener('click', openCsvImport);
document.getElementById('ibImportClose').addEventListener('click', closeCsvImport);
document.getElementById('ibImportOverlay').addEventListener('click', e=>{ if(e.target.id==='ibImportOverlay') closeCsvImport(); });
document.getElementById('ibCsvFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ document.getElementById('ibCsvPaste').value = reader.result; };
  reader.readAsText(file);
});
document.getElementById('ibCsvPreviewBtn').addEventListener('click', ()=>{
  const text = document.getElementById('ibCsvPaste').value;
  const wrap = document.getElementById('ibCsvPreviewWrap');
  const res = parseInbodyCsv(text);
  if(!res.ok){ wrap.innerHTML = `<div class="ib-preview-note warn">${res.error}</div>`; ibPendingImport=null; return; }
  if(!res.parsed.length){ wrap.innerHTML = `<div class="ib-preview-note warn">가져올 수 있는 행이 없어요.</div>`; ibPendingImport=null; return; }
  ibPendingImport = res.parsed;
  // 미리보기: 인식된 항목이 있는 컬럼만 보여준다
  const present = IB_VALUE_FIELDS.filter(f=>res.parsed.some(r=>r[f.key]!=null && r[f.key]!==''));
  const cols = ['date', ...present.map(f=>f.key), ...(res.parsed.some(r=>r.memo)? ['memo']:[])];
  const labels = Object.assign({date:'날짜', memo:'기타'}, Object.fromEntries(IB_VALUE_FIELDS.map(f=>[f.key,f.label])));
  wrap.innerHTML = `
    <div class="ib-preview-wrap-scroll"><table class="ib-preview-table">
      <thead><tr>${cols.map(c=>`<th>${labels[c]}</th>`).join('')}</tr></thead>
      <tbody>${res.parsed.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??''}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="ib-preview-note">${res.parsed.length}건을 인식했어요.${res.skipped.length? ` (${res.skipped.length}건 건너뜀)`:''}</div>
    ${res.skipped.length? `<div class="ib-preview-note warn">${res.skipped.join(' · ')}</div>`:''}
    <div class="field-row" style="margin-top:12px"><button class="primary-btn" id="ibCsvConfirmBtn">${res.parsed.length}건 가져오기</button></div>
  `;
  document.getElementById('ibCsvConfirmBtn').addEventListener('click', commitCsvImport);
});
function commitCsvImport(){
  if(!ibPendingImport || !ibPendingImport.length) return;
  ibPendingImport.forEach(entry=>{
    const {date, ...fields} = entry;
    const cur = getLog(date);
    const merged = {...cur, inbody:{...(cur.inbody||{}), ...fields}, date};
    state.logs[date] = merged;
    persist(date, merged);
  });
  const n = ibPendingImport.length;
  ibPendingImport = null;
  renderCalendar();
  renderInbodyTab();
  closeCsvImport();
  showToast(`인바디 기록 ${n}건을 가져왔어요`);
}

function switchTab(view){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
  if(view==='inbody') renderInbodyTab();
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.dataset.view));
});
document.getElementById('dataBtn').addEventListener('click', openDataModal);
document.getElementById('dataClose').addEventListener('click', closeDataModal);
document.getElementById('dataOverlay').addEventListener('click', e=>{ if(e.target.id==='dataOverlay') closeDataModal(); });

   init
   ========================================================= */
renderPartFilters();
renderLibrary();
renderCalendar();
initDb();
